<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="theme-color" content="#121212" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>NRN Music</title>
<style>
/* ---------- Design tokens (Spotify-inspired) ---------- */
:root {
  --bg: #000000;
  --bg-2: #121212;
  --surface: #181818;
  --surface-hover: #282828;
  --surface-2: #1f1f1f;
  --accent: #1ed760;
  --accent-hover: #1db954;
  --text: #ffffff;
  --text-sub: #b3b3b3;
  --text-dim: #727272;
  --border: rgba(255,255,255,.08);
  --danger: #e91429;
  --player-h: 88px;
  --sidebar-w: 260px;
  --radius: 8px;
  --pill: 9999px;
  --shadow: 0 8px 24px rgba(0,0,0,.5);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; height: 100%; width: 100%;
  background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 16px; line-height: 1.5;
  overflow: hidden; /* no outer scrollbars — inner areas scroll */
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overscroll-behavior: none;
}
body {
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
}
a { color: inherit; text-decoration: none; }
button {
  font-family: inherit; color: inherit; background: none;
  border: 0; cursor: pointer; padding: 0;
  touch-action: manipulation;
  min-width: 44px; min-height: 44px;
}
input, select, textarea { font-size: 16px; font-family: inherit; }
img { display: block; max-width: 100%; }

/* ---------- Layout ---------- */
.app {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  grid-template-rows: 1fr var(--player-h);
  grid-template-areas:
    "sidebar main"
    "player  player";
  height: 100dvh; /* dynamic viewport — resizes with mobile URL bar */
  gap: 8px;
  padding: 8px;
  padding-bottom: calc(8px + env(safe-area-inset-bottom));
}
.sidebar { grid-area: sidebar; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.main    { grid-area: main;    background: var(--bg-2); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.player  { grid-area: player;  background: var(--bg); }

/* ---------- Sidebar ---------- */
.nav-card {
  background: var(--bg-2); border-radius: var(--radius);
  padding: 8px 12px;
}
.nav-link {
  display: flex; align-items: center; gap: 16px;
  padding: 10px 12px; border-radius: 6px;
  color: var(--text-sub); font-weight: 700; font-size: 15px;
  transition: color .15s ease;
  min-height: 48px;
}
.nav-link:hover { color: var(--text); }
.nav-link.active { color: var(--text); }
.nav-link svg { width: 24px; height: 24px; flex-shrink: 0; }

.library-card {
  background: var(--bg-2); border-radius: var(--radius);
  flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column;
}
.lib-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px 8px; color: var(--text-sub); font-weight: 700;
}
.lib-head button { color: var(--text-sub); min-width: 36px; min-height: 36px; border-radius: var(--pill); }
.lib-head button:hover { color: var(--text); background: var(--surface); }
.lib-list {
  overflow-y: auto; padding: 4px 8px 8px;
  scrollbar-width: thin; scrollbar-color: transparent transparent;
}
.lib-list:hover { scrollbar-color: #4d4d4d transparent; }
.lib-list::-webkit-scrollbar { width: 10px; }
.lib-list::-webkit-scrollbar-thumb { background: transparent; border-radius: 10px; }
.lib-list:hover::-webkit-scrollbar-thumb { background: #4d4d4d; }
.lib-item {
  display: grid; grid-template-columns: 48px 1fr; gap: 12px; align-items: center;
  padding: 8px; border-radius: 6px; cursor: pointer;
}
.lib-item:hover { background: var(--surface); }
.lib-thumb { width: 48px; height: 48px; border-radius: 4px; background: var(--surface-2); object-fit: cover; }
.lib-thumb.round { border-radius: 50%; }
.lib-title { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lib-sub   { font-size: 13px; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- Main content ---------- */
.main-topbar {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; gap: 12px;
  padding: 14px 24px;
  background: linear-gradient(180deg, rgba(0,0,0,.6), transparent);
  backdrop-filter: blur(8px);
}
.nav-chevs { display: flex; gap: 8px; }
.icon-btn {
  width: 36px; height: 36px; min-width: 36px; min-height: 36px;
  border-radius: 50%; background: rgba(0,0,0,.55);
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--text);
}
.icon-btn:hover { background: #000; }
.icon-btn svg { width: 18px; height: 18px; }

.search-wrap {
  position: relative; flex: 1 1 auto; max-width: 420px;
}
.search-wrap svg {
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  width: 20px; height: 20px; color: var(--text-sub); pointer-events: none;
}
.search-input {
  width: 100%; height: 48px; border-radius: var(--pill);
  background: var(--surface-2); color: var(--text);
  border: 0; padding: 0 16px 0 44px; outline: none;
  font-weight: 500;
}
.search-input:focus { outline: 2px solid var(--text); }
.topbar-spacer { flex: 1 1 auto; }
.signup-btn, .login-btn {
  padding: 0 18px; height: 48px; border-radius: var(--pill);
  font-weight: 700; font-size: 15px; min-width: auto;
}
.signup-btn { color: var(--text-sub); }
.signup-btn:hover { color: var(--text); transform: scale(1.04); }
.login-btn { background: var(--text); color: #000; }
.login-btn:hover { transform: scale(1.04); background: #f6f6f6; }

.content {
  flex: 1 1 auto; overflow-y: auto;
  padding: 8px 24px 32px;
  scrollbar-width: thin; scrollbar-color: #4d4d4d transparent;
}
.content::-webkit-scrollbar { width: 12px; }
.content::-webkit-scrollbar-thumb { background: #4d4d4d; border-radius: 10px; border: 3px solid var(--bg-2); }

.page-title {
  font-size: 28px; font-weight: 800; letter-spacing: -.02em;
  margin: 8px 0 18px;
}

/* ---------- Hero banner (playlist / album) ---------- */
.hero {
  display: grid; grid-template-columns: 232px 1fr; gap: 24px; align-items: end;
  padding: 24px 24px 32px;
  background: linear-gradient(180deg, #3e3e3e 0%, #2a2a2a 45%, var(--bg-2) 100%);
  margin: -8px -24px 24px;
}
.hero-art {
  width: 232px; height: 232px; border-radius: 6px;
  background: var(--surface-2); box-shadow: var(--shadow); object-fit: cover;
}
.hero-meta .kind { text-transform: uppercase; font-size: 12px; font-weight: 700; letter-spacing: .04em; }
.hero-meta h1 {
  font-size: clamp(32px, 6vw, 80px);
  font-weight: 900; letter-spacing: -.03em; line-height: 1;
  margin: 12px 0 16px;
  word-break: break-word;
}
.hero-meta .desc { color: var(--text-sub); font-size: 14px; margin-bottom: 14px; }
.hero-meta .byline { font-size: 14px; color: var(--text-sub); }
.hero-meta .byline strong { color: var(--text); }

/* ---------- Action row ---------- */
.actions {
  display: flex; align-items: center; gap: 24px;
  margin: 0 0 20px;
}
.play-big {
  width: 56px; height: 56px; min-width: 56px; min-height: 56px;
  border-radius: 50%; background: var(--accent); color: #000;
  display: inline-flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 16px rgba(0,0,0,.3);
  transition: transform .12s ease, background .12s ease;
}
.play-big:hover { transform: scale(1.06); background: #3be477; }
.play-big svg { width: 26px; height: 26px; margin-left: 3px; }
.icon-btn.light { background: transparent; color: var(--text-sub); width: 40px; height: 40px; }
.icon-btn.light:hover { color: var(--text); }

/* ---------- Track table ---------- */
.track-table { width: 100%; border-collapse: collapse; }
.track-table th {
  text-align: left; color: var(--text-sub); font-weight: 400; font-size: 12px;
  text-transform: uppercase; letter-spacing: .08em;
  padding: 8px 16px; border-bottom: 1px solid var(--border);
  position: sticky; top: 0; background: var(--bg-2);
}
.track-table th.num, .track-table td.num { width: 40px; text-align: right; color: var(--text-sub); }
.track-table th.len, .track-table td.len { width: 80px; text-align: right; color: var(--text-sub); }
.track-table td {
  padding: 8px 16px; border-radius: 4px; font-size: 14px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.track-row { cursor: pointer; }
.track-row:hover td { background: var(--surface); }
.track-row:hover .num { color: var(--text); }
.track-row.playing td { background: var(--surface); }
.track-row.playing .t-title { color: var(--accent); }
.track-cell {
  display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: center;
}
.t-thumb { width: 40px; height: 40px; border-radius: 3px; background: var(--surface-2); object-fit: cover; }
.t-title { font-weight: 500; }
.t-artist { color: var(--text-sub); font-size: 13px; }
.t-artist a:hover { color: var(--text); text-decoration: underline; }
.t-album { color: var(--text-sub); max-width: 280px; overflow: hidden; text-overflow: ellipsis; }
.t-album a:hover { color: var(--text); text-decoration: underline; }
.t-num { display: inline-flex; align-items: center; justify-content: flex-end; width: 100%; min-height: 24px; }
.track-row:hover .t-num .idx { display: none; }
.track-row:hover .t-num .play-ico { display: inline; }
.play-ico { display: none; width: 16px; height: 16px; }

/* ---------- Card grids ---------- */
.section-head {
  display: flex; align-items: baseline; justify-content: space-between;
  margin: 28px 0 14px;
}
.section-head h2 {
  font-size: 22px; font-weight: 800; letter-spacing: -.01em; margin: 0;
}
.section-head .see-all { color: var(--text-sub); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
.section-head .see-all:hover { text-decoration: underline; }

.card-grid {
  display: grid; gap: 20px;
  grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
}
.card {
  background: var(--surface); border-radius: var(--radius);
  padding: 16px; cursor: pointer; position: relative;
  transition: background .25s ease;
  min-width: 0;
}
.card:hover { background: var(--surface-hover); }
.card:hover .card-play { opacity: 1; transform: translateY(0); }
.card-art {
  aspect-ratio: 1 / 1; width: 100%; border-radius: 6px;
  background: var(--surface-2); margin-bottom: 14px;
  object-fit: cover; box-shadow: 0 8px 20px rgba(0,0,0,.4);
}
.card-art.round { border-radius: 50%; }
.card-title {
  font-weight: 700; font-size: 15px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.card-sub {
  color: var(--text-sub); font-size: 13px; margin-top: 4px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-play {
  position: absolute; right: 22px; top: calc(50% - 56px);
  width: 48px; height: 48px; border-radius: 50%;
  background: var(--accent); color: #000;
  display: inline-flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 16px rgba(0,0,0,.45);
  opacity: 0; transform: translateY(8px);
  transition: opacity .2s ease, transform .2s ease, background .15s;
  min-width: 48px; min-height: 48px;
}
.card-play:hover { background: #3be477; transform: translateY(0) scale(1.05); }
.card-play svg { width: 20px; height: 20px; margin-left: 2px; }

/* ---------- Filter chips (search) ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
.chip {
  padding: 6px 14px; height: 34px; min-height: 34px; min-width: auto;
  border-radius: var(--pill); background: var(--surface);
  color: var(--text); font-size: 14px; font-weight: 500;
}
.chip:hover { background: var(--surface-hover); }
.chip.active { background: var(--text); color: #000; }

/* ---------- Player bar ---------- */
.player {
  display: grid;
  grid-template-columns: 1fr 2fr 1fr;
  align-items: center;
  gap: 16px;
  padding: 0 16px;
  padding-bottom: env(safe-area-inset-bottom);
}
.p-now {
  display: grid; grid-template-columns: 56px 1fr 32px; gap: 14px; align-items: center;
  min-width: 0;
}
.p-thumb { width: 56px; height: 56px; border-radius: 6px; background: var(--surface-2); object-fit: cover; }
.p-title { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p-artist { font-size: 12px; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p-artist:hover { color: var(--text); text-decoration: underline; cursor: pointer; }
.p-like { color: var(--text-sub); }
.p-like:hover { color: var(--text); }
.p-like.active { color: var(--accent); }

.p-center { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.p-controls { display: flex; align-items: center; gap: 12px; }
.pc-btn {
  width: 32px; height: 32px; min-width: 32px; min-height: 32px;
  color: var(--text-sub); display: inline-flex; align-items: center; justify-content: center;
  border-radius: 50%;
}
.pc-btn:hover { color: var(--text); }
.pc-btn svg { width: 18px; height: 18px; }
.pc-btn.big {
  width: 36px; height: 36px; min-width: 36px; min-height: 36px;
  background: var(--text); color: #000; border-radius: 50%;
}
.pc-btn.big:hover { transform: scale(1.05); color: #000; }
.pc-btn.active { color: var(--accent); }

.progress {
  display: flex; align-items: center; gap: 8px; width: 100%; max-width: 640px;
}
.time { font-size: 11px; color: var(--text-sub); font-variant-numeric: tabular-nums; min-width: 40px; text-align: center; }
.slider {
  -webkit-appearance: none; appearance: none;
  flex: 1 1 auto; height: 4px; border-radius: 2px;
  background: #4d4d4d; outline: none; cursor: pointer;
}
.slider::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--text); opacity: 0; transition: opacity .15s;
}
.slider:hover::-webkit-slider-thumb { opacity: 1; }
.slider::-moz-range-thumb {
  width: 12px; height: 12px; border: 0; border-radius: 50%; background: var(--text);
}

.p-right {
  display: flex; align-items: center; justify-content: flex-end; gap: 8px;
  min-width: 0;
}
.vol { max-width: 100px; }

/* ---------- Mobile bottom nav (replaces sidebar) ---------- */
.mob-nav {
  display: none;
  position: fixed; left: 0; right: 0;
  bottom: calc(var(--player-h) + env(safe-area-inset-bottom));
  z-index: 50;
  background: linear-gradient(0deg, rgba(0,0,0,.98), rgba(0,0,0,.85));
  padding: 6px 0 calc(6px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--border);
}
.mob-nav-inner {
  display: grid; grid-template-columns: repeat(4, 1fr);
  max-width: 520px; margin: 0 auto;
}
.mob-btn {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 4px; padding: 6px 0; color: var(--text-sub); font-size: 11px; font-weight: 500;
  min-height: 56px;
}
.mob-btn.active { color: var(--text); }
.mob-btn svg { width: 24px; height: 24px; }

/* ---------- Loading / empty ---------- */
.spinner {
  width: 36px; height: 36px; border-radius: 50%;
  border: 3px solid var(--surface-2); border-top-color: var(--accent);
  animation: spin .8s linear infinite; margin: 40px auto;
}
@keyframes spin { to { transform: rotate(360deg); } }
.empty {
  text-align: center; color: var(--text-sub); padding: 60px 20px;
}
.toast {
  position: fixed; left: 50%; bottom: calc(var(--player-h) + 80px + env(safe-area-inset-bottom));
  transform: translateX(-50%) translateY(20px);
  background: #2e77d0; color: #fff;
  padding: 10px 18px; border-radius: var(--pill); font-size: 14px; font-weight: 600;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
  z-index: 100;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------- Responsive ---------- */
@media (max-width: 1024px) {
  .t-album { display: none; }
  .track-table th.album { display: none; }
}
@media (max-width: 860px) {
  .app {
    grid-template-columns: 1fr;
    grid-template-rows: 1fr var(--player-h);
    grid-template-areas: "main" "player";
    padding: 0;
  }
  .sidebar { display: none; }
  .mob-nav { display: block; }
  .main { border-radius: 0; }
  .content { padding: 8px 16px 120px; }
  .main-topbar { padding: 12px 16px; }
  .signup-btn, .login-btn { display: none; }
  .hero {
    grid-template-columns: 160px 1fr; gap: 16px;
    padding: 20px 16px 24px; margin: -8px -16px 20px;
  }
  .hero-art { width: 160px; height: 160px; }
  .player {
    grid-template-columns: 1fr auto;
    grid-template-rows: auto auto;
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
    gap: 6px;
  }
  .p-now { grid-column: 1 / 2; grid-row: 1; }
  .p-center { grid-column: 1 / -1; grid-row: 2; }
  .p-right { grid-column: 2 / 3; grid-row: 1; }
  .p-controls .pc-btn:not(.big):nth-child(1),
  .p-controls .pc-btn:not(.big):nth-child(5) { display: none; } /* hide shuffle / repeat on very small */
  .card-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }
  .card { padding: 12px; }
  .card-play { right: 16px; top: calc(50% - 52px); }
  .track-table th.num, .track-table td.num { width: 28px; padding: 8px 6px; }
  .track-table th.len, .track-table td.len { width: 56px; }
  .track-table td { padding: 8px 6px; }
}
@media (max-width: 480px) {
  .hero { grid-template-columns: 1fr; text-align: center; }
  .hero-art { width: 180px; height: 180px; margin: 0 auto; }
  .actions { justify-content: center; }
  .p-right { display: none; }
  .player { grid-template-columns: 1fr; }
  .p-now .p-like { display: none; }
}

/* Hide scrollbars on touch devices for cleaner look */
@media (hover: none) {
  .lib-list::-webkit-scrollbar, .content::-webkit-scrollbar { display: none; }
  .lib-list, .content { scrollbar-width: none; }
}
</style>
</head>
<body>

<div class="app">
  <!-- ================= SIDEBAR (desktop) ================= -->
  <aside class="sidebar" aria-label="Primary navigation">
    <div class="nav-card">
      <a class="nav-link active" data-route="home" href="#home">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.5 3.247a1 1 0 00-1 0L4 7.577V20h4.5v-6a1 1 0 011-1h5a1 1 0 011 1v6H20V7.577l-7.5-4.33zm-2-1.732a3 3 0 013 0l7.5 4.33a2 2 0 011 1.732V21a1 1 0 01-1 1h-6.5a1 1 0 01-1-1v-6h-3v6a1 1 0 01-1 1H3a1 1 0 01-1-1V7.577a2 2 0 011-1.732l7.5-4.33z"/></svg>
        Home
      </a>
      <a class="nav-link" data-route="search" href="#search">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10.533 1.279c-5.18 0-9.407 4.14-9.407 9.279s4.226 9.279 9.407 9.279c2.234 0 4.29-.77 5.907-2.058l4.353 4.353a1 1 0 101.414-1.414l-4.344-4.344a9.157 9.157 0 002.077-5.816c0-5.14-4.225-9.28-9.407-9.28zm-7.407 9.279c0-4.006 3.302-7.28 7.407-7.28s7.407 3.274 7.407 7.28-3.302 7.279-7.407 7.279-7.407-3.273-7.407-7.28z"/></svg>
        Search
      </a>
    </div>

    <div class="library-card">
      <div class="lib-head">
        <div style="display:flex;align-items:center;gap:10px">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M14.5 2.134a1 1 0 011 0l6 3.464a1 1 0 01.5.866V21a1 1 0 01-1 1h-6a1 1 0 01-1-1V3a1 1 0 01.5-.866zM16 4.732V20h4V7.041l-4-2.309zM3 22a1 1 0 01-1-1V3a1 1 0 012 0v18a1 1 0 01-1 1zm6 0a1 1 0 01-1-1V3a1 1 0 012 0v18a1 1 0 01-1 1z"/></svg>
          Your Library
        </div>
        <button title="Create playlist" id="newPlBtn">
          <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor"><path d="M15.25 8a.75.75 0 01-.75.75H8.75v5.75a.75.75 0 01-1.5 0V8.75H1.5a.75.75 0 010-1.5h5.75V1.5a.75.75 0 011.5 0v5.75h5.75a.75.75 0 01.75.75z"/></svg>
        </button>
      </div>
      <div class="lib-list" id="libList">
        <div class="lib-item" data-playlist="PLFgquLnL59alCl_2TQvOiD5Vgm1hCaGSI">
          <img class="lib-thumb" src="" alt="" onerror="this.style.visibility='hidden'"/>
          <div>
            <div class="lib-title">Today's Top Hits</div>
            <div class="lib-sub">Playlist · Spotify</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   NRN Music — Frontend
   Vanilla JS SPA: hash routing + state module + fetch layer.
   ============================================================ */
(() => {
  'use strict';

  // ---------- API base: relative so it works on any Vercel domain ----------
  const API = '/api';

  // ---------- Icons (inline SVGs for play overlay) ----------
  const ICO_PLAY_SM = '<svg class="play-ico" viewBox="0 0 16 16" fill="currentColor"><path d="M3 1.713a.7.7 0 011.05-.607l10.89 6.288a.7.7 0 010 1.212L4.05 14.894A.7.7 0 013 14.288V1.713z"/></svg>';
  const ICO_PLAY = '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M3 1.713a.7.7 0 011.05-.607l10.89 6.288a.7.7 0 010 1.212L4.05 14.894A.7.7 0 013 14.288V1.713z"/></svg>';
  const ICO_PAUSE = '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M2.7 1a.7.7 0 00-.7.7v12.6a.7.7 0 00.7.7h3.6a.7.7 0 00.7-.7V1.7a.7.7 0 00-.7-.7H2.7zm7 0a.7.7 0 00-.7.7v12.6a.7.7 0 00.7.7h3.6a.7.7 0 00.7-.7V1.7a.7.7 0 00-.7-.7H9.7z"/></svg>';

  // ---------- Utilities ----------
  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
  const fmt = (s) => {
    if (!s || !isFinite(s)) return '0:00';
    s = Math.floor(s);
    const m = Math.floor(s / 60), r = s % 60;
    return `${m}:${String(r).padStart(2, '0')}`;
  };
  const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
  const toast = (msg) => {
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200);
  };
  const debounce = (fn, ms) => {
    let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
  };

  // ---------- App state ----------
  const state = {
    queue: [],        // [{videoId,title,artist,thumbnail,duration,album,...}]
    index: -1,
    current: null,    // full song payload from /api/song/{id}
    shuffle: false,
    repeat: 0,        // 0 none, 1 all, 2 one
    volume: 0.7,
    history: [],      // for back/forward
    histIdx: -1,
    searchType: 'all',
  };

  // ---------- Audio element ----------
  const audio = $('#audio');
  audio.volume = state.volume;

  // ---------- Player controls ----------
  const playBtn = $('#playBtn'), playIco = $('#playIco');
  const shuffleBtn = $('#shuffleBtn'), repeatBtn = $('#repeatBtn');
  const seek = $('#seek'), vol = $('#vol'), muteBtn = $('#muteBtn'), volIco = $('#volIco');
  const curTime = $('#curTime'), durTime = $('#durTime');
  const pThumb = $('#pThumb'), pTitle = $('#pTitle'), pArtist = $('#pArtist');

  function setPlayingIcon(isPlaying) {
    playIco.innerHTML = isPlaying ? ICO_PAUSE : ICO_PLAY;
    playBtn.setAttribute('aria-label', isPlaying ? 'Pause' : 'Play');
  }

  async function loadAndPlay(index, autoplay = true) {
    if (index < 0 || index >= state.queue.length) return;
    state.index = index;
    const t = state.queue[index];
    // optimistic UI update
    pTitle.textContent = t.title || 'Loading…';
    pArtist.textContent = t.artist || '';
    if (t.thumbnail) { pThumb.src = t.thumbnail; pThumb.style.visibility = 'visible'; }
    try {
      const res = await fetch(`${API}/song/${encodeURIComponent(t.videoId)}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'upstream error');
      state.current = data;
      audio.src = data.streamUrl;
      audio.playbackRate = 1;
      if (autoplay) {
        const p = audio.play();
        if (p && p.catch) p.catch(() => { /* autoplay blocked; user will press play */ });
      }
      highlightPlayingRow();
      updatePageTitle();
    } catch (err) {
      toast('Couldn’t load track: ' + err.message);
      console.error(err);
    }
  }

  function togglePlay() {
    if (!state.current || !audio.src) {
      if (state.queue.length) loadAndPlay(0, true);
      return;
    }
    if (audio.paused) audio.play().catch(()=>{}); else audio.pause();
  }
  function nextTrack(auto = false) {
    if (!state.queue.length) return;
    if (state.repeat === 2 && auto) { audio.currentTime = 0; audio.play().catch(()=>{}); return; }
    let next;
    if (state.shuffle) {
      if (state.queue.length < 2) next = 0;
      else do { next = Math.floor(Math.random() * state.queue.length); } while (next === state.index);
    } else {
      next = state.index + 1;
      if (next >= state.queue.length) {
        if (state.repeat === 1 || !auto) next = 0; else { audio.pause(); return; }
      }
    }
    loadAndPlay(next, true);
  }
  function prevTrack() {
    if (!state.queue.length) return;
    if (audio.currentTime > 3) { audio.currentTime = 0; return; }
    let prev = state.index - 1;
    if (prev < 0) prev = state.repeat === 1 ? state.queue.length - 1 : 0;
    loadAndPlay(prev, true);
  }

  playBtn.addEventListener('click', togglePlay);
  $('#nextBtn').addEventListener('click', () => nextTrack(false));
  $('#prevBtn').addEventListener('click', prevTrack);
  shuffleBtn.addEventListener('click', () => {
    state.shuffle = !state.shuffle;
    shuffleBtn.classList.toggle('active', state.shuffle);
    toast(state.shuffle ? 'Shuffle on' : 'Shuffle off');
  });
  repeatBtn.addEventListener('click', () => {
    state.repeat = (state.repeat + 1) % 3;
    repeatBtn.classList.toggle('active', state.repeat !== 0);
    const labels = ['Repeat off', 'Repeat all', 'Repeat one'];
    toast(labels[state.repeat]);
  });

  audio.addEventListener('play',  () => setPlayingIcon(true));
  audio.addEventListener('pause', () => setPlayingIcon(false));
  audio.addEventListener('ended', () => nextTrack(true));
  audio.addEventListener('loadedmetadata', () => {
    seek.max = String(audio.duration || 0);
    durTime.textContent = fmt(audio.duration);
  });
  audio.addEventListener('timeupdate', () => {
    if (!seek.matches(':active')) seek.value = String(audio.currentTime);
    curTime.textContent = fmt(audio.currentTime);
  });
  audio.addEventListener('error', () => {
    toast('Playback error — trying next track');
    setTimeout(() => nextTrack(true), 600);
  });

  seek.addEventListener('input', () => {
    const v = parseFloat(seek.value);
    if (isFinite(v) && isFinite(audio.duration)) audio.currentTime = clamp(v, 0, audio.duration);
    curTime.textContent = fmt(v);
  });
  vol.addEventListener('input', () => {
    const v = parseInt(vol.value, 10) / 100;
    state.volume = v; audio.volume = v; audio.muted = v === 0;
    updateVolIcon();
  });
  muteBtn.addEventListener('click', () => {
    audio.muted = !audio.muted; updateVolIcon();
  });
  function updateVolIcon() {
    const m = audio.muted || state.volume === 0;
    muteBtn.classList.toggle('active', m);
    if (m) volIco.innerHTML = '<path d="M13.86 5.47a.75.75 0 00-1.061 0l-1.47 1.47-1.47-1.47A.75.75 0 008.8 6.53L10.269 8l-1.47 1.47a.75.75 0 101.06 1.06l1.47-1.47 1.47 1.47a.75.75 0 001.06-1.06L12.39 8l1.47-1.47a.75.75 0 000-1.06z"/><path d="M10.116 1.5A.75.75 0 0110.5 2.25v11.5a.75.75 0 01-1.125.65l-6.925-4a3.642 3.642 0 01-1.33-4.967 3.639 3.639 0 011.33-1.332l6.925-4a.75.75 0 01.741 0zm-6.924 5.3a2.139 2.139 0 000 3.7l5.8 3.35V3.45l-5.8 3.35z"/>';
    else if (state.volume < 0.5) volIco.innerHTML = '<path d="M9.741.85a.75.75 0 01.375.65v13a.75.75 0 01-1.125.65l-6.925-4a3.642 3.642 0 01-1.33-4.967 3.639 3.639 0 011.33-1.332l6.925-4a.75.75 0 01.75 0zm-6.924 5.3a2.139 2.139 0 000 3.7l5.8 3.35V2.8l-5.8 3.35zm8.683 4.29V5.56a2.75 2.75 0 010 4.88z"/>';
    else volIco.innerHTML = '<path d="M9.741.85a.75.75 0 01.375.65v13a.75.75 0 01-1.125.65l-6.925-4a3.642 3.642 0 01-1.33-4.967 3.639 3.639 0 011.33-1.332l6.925-4a.75.75 0 01.75 0zm-6.924 5.3a2.139 2.139 0 000 3.7l5.8 3.35V2.8l-5.8 3.35zm8.683 4.29V5.56a2.75 2.75 0 010 4.88z"/><path d="M11.5 13.614a5.752 5.752 0 000-11.228v1.55a4.252 4.252 0 010 8.127v1.55z"/>';
  }
  updateVolIcon();

  function updatePageTitle() {
    const t = state.queue[state.index];
    document.title = t ? `${t.title} — ${t.artist || 'NRN Music'}` : 'NRN Music';
  }

  function highlightPlayingRow() {
    $$('.track-row').forEach(r => r.classList.remove('playing'));
    const cur = state.queue[state.index];
    if (!cur) return;
    const row = $(`tr[data-video-id="${cur.videoId}"]`);
    if (row) row.classList.add('playing');
  }

  // ---------- Playback from any source ----------
  window.Player = {
    playTracks(tracks, startIndex = 0) {
      if (!tracks || !tracks.length) { toast('Nothing to play'); return; }
      state.queue = tracks.filter(t => t && t.videoId);
      loadAndPlay(startIndex, true);
    },
    playOne(track) { this.playTracks([track], 0); },
    append(tracks) {
      state.queue.push(...(tracks || []).filter(t => t && t.videoId));
      toast(`Added ${tracks.length} to queue`);
    },
  };

  // ---------- Routing ----------
  const content = $('#content');
  const historyStack = [];

  function render(html) { content.innerHTML = html; }
  function spinner() { return '<div class="spinner" aria-label="Loading"></div>'; }
  function empty(msg) { return `<div class="empty">${msg}</div>`; }

  async function goHome() {
    render(spinner());
    try {
      const res = await fetch(`${API}/trending`);
      const data = await res.json();
      if (!data.ok) throw new Error('bad response');
      let html = '';
      (data.sections || []).forEach((sec, i) => {
        html += `<div class="section-head"><h2>${escapeHtml(sec.title || '')}</h2></div>`;
        html += `<div class="card-grid">` + (sec.items || []).slice(0, 8).map(cardHtml).join('') + `</div>`;
      });
      if (!data.sections?.length) html = empty('Nothing to show right now. Try searching.');
      render(html);
      bindCardClicks();
    } catch (e) {
      render(empty('Couldn’t load home feed. ' + e.message));
    }
  }

  let lastSearch = '';
  function goSearch(q = '', type = 'all') {
    state.searchType = type;
    const wrap = $('#searchWrap');
    wrap.style.display = '';
    const input = $('#searchInput');
    if (q) input.value = q;
    input.focus({ preventScroll: true });

    const typeLabels = { all: 'All', songs: 'Songs', albums: 'Albums', artists: 'Artists', playlists: 'Playlists' };
    const chips = Object.entries(typeLabels).map(([k, l]) =>
      `<button class="chip ${k === type ? 'active' : ''}" data-type="${k}">${l}</button>`
    ).join('');

    if (!q.trim()) {
      render(`
        <div style="padding:24px 4px">
          <h1 class="page-title">Browse all</h1>
          <div class="card-grid">
            ${GENRE_CARDS.map(g => `
              <div class="card" style="background:linear-gradient(135deg, ${g.c1}, ${g.c2}); min-height:180px; display:flex; align-items:flex-end; padding:16px;">
                <div class="card-title" style="font-size:24px; font-weight:900; text-shadow:0 2px 8px rgba(0,0,0,.4)">${escapeHtml(g.name)}</div>
              </div>
            `).join('')}
          </div>
        </div>
      `);
      $$('.card', content).forEach(c => c.addEventListener('click', () => {
        const name = c.querySelector('.card-title').textContent;
        $('#searchInput').value = name;
        doSearch(name, state.searchType);
      }));
      return;
    }
    doSearch(q, type);
  }

  async function doSearch(q, type) {
    lastSearch = q;
    const typeLabels = { all: 'All', songs: 'Songs', albums: 'Albums', artists: 'Artists', playlists: 'Playlists' };
    const chips = Object.entries(typeLabels).map(([k, l]) =>
      `<button class="chip ${k === type ? 'active' : ''}" data-type="${k}">${l}</button>`
    ).join('');
    render(`<h1 class="page-title">Results for "${escapeHtml(q)}"</h1><div class="chips">${chips}</div>${spinner()}`);
    $$('.chip', content).forEach(el => el.addEventListener('click', () => doSearch(q, el.dataset.type)));
    try {
      const res = await fetch(`${API}/search?q=${encodeURIComponent(q)}&type=${encodeURIComponent(type)}&limit=30`);
      const data = await res.json();
      if (!data.ok) throw new Error('search failed');
      const items = data.items || [];
      if (!items.length) { render(`<h1 class="page-title">Results for "${escapeHtml(q)}"</h1><div class="chips">${chips}</div>${empty('No results found')}`); $$('.chip', content).forEach(el => el.addEventListener('click', () => doSearch(q, el.dataset.type))); return; }

      const songs = items.filter(i => i.resultType === 'song' || i.resultType === 'video');
      const albums = items.filter(i => i.resultType === 'album');
      const artists = items.filter(i => i.resultType === 'artist');
      const playlists = items.filter(i => i.resultType === 'playlist');

      let html = `<h1 class="page-title">Results for "${escapeHtml(q)}"</h1><div class="chips">${chips}</div>`;

      if (type === 'all' || type === 'songs') {
        if (songs.length) {
          if (type === 'all') html += `<div class="section-head"><h2>Songs</h2></div>`;
          html += trackTableHtml(songs, true);
        }
      }
      if ((type === 'all' || type === 'artists') && artists.length) {
        if (type === 'all') html += `<div class="section-head"><h2>Artists</h2></div>`;
        html += `<div class="card-grid">${artists.map(a => cardHtml({ ...a, name: a.name, sub: 'Artist' })).join('')}</div>`;
      }
      if ((type === 'all' || type === 'albums') && albums.length) {
        if (type === 'all') html += `<div class="section-head"><h2>Albums</h2></div>`;
        html += `<div class="card-grid">${albums.map(al => cardHtml({ ...al, sub: al.artist || 'Album' })).join('')}</div>`;
      }
      if ((type === 'all' || type === 'playlists') && playlists.length) {
        if (type === 'all') html += `<div class="section-head"><h2>Playlists</h2></div>`;
        html += `<div class="card-grid">${playlists.map(p => cardHtml({ ...p, sub: p.author || 'Playlist' })).join('')}</div>`;
      }
      render(html);
      bindCardClicks();
      bindTrackTable(songs);
      $$('.chip', content).forEach(el => el.addEventListener('click', () => doSearch(q, el.dataset.type)));
    } catch (e) {
      render(empty('Search failed: ' + e.message));
    }
  }

  async function goPlaylist(id) {
    render(spinner());
    try {
      const res = await fetch(`${API}/playlist/${encodeURIComponent(id)}`);
      const d = await res.json();
      if (!d.ok) throw new Error('playlist failed');
      const tracks = d.tracks || [];
      render(`
        <div class="hero">
          <img class="hero-art" src="${d.thumbnail || ''}" alt="" onerror="this.style.visibility='hidden'"/>
          <div class="hero-meta">
            <div class="kind">Playlist</div>
            <h1>${escapeHtml(d.title || '')}</h1>
            <div class="desc">${escapeHtml(d.description || '')}</div>
            <div class="byline"><strong>${escapeHtml(d.author || '')}</strong> · ${d.trackCount || 0} songs</div>
          </div>
        </div>
        <div class="actions">
          <button class="play-big" id="heroPlay" aria-label="Play">${ICO_PLAY}</button>
        </div>
        ${trackTableHtml(tracks)}
      `);
      $('#heroPlay').addEventListener('click', () => Player.playTracks(tracks, 0));
      bindTrackTable(tracks);
    } catch (e) { render(empty('Couldn’t load playlist. ' + e.message)); }
  }

  async function goAlbum(id) {
    render(spinner());
    try {
      const res = await fetch(`${API}/album/${encodeURIComponent(id)}`);
      const d = await res.json();
      if (!d.ok) throw new Error('album failed');
      const tracks = d.tracks || [];
      render(`
        <div class="hero">
          <img class="hero-art" src="${d.thumbnail || ''}" alt="" onerror="this.style.visibility='hidden'"/>
          <div class="hero-meta">
            <div class="kind">Album</div>
            <h1>${escapeHtml(d.title || '')}</h1>
            <div class="byline"><strong>${escapeHtml(d.artist || '')}</strong> · ${d.year || ''} · ${d.trackCount || 0} songs</div>
          </div>
        </div>
        <div class="actions">
          <button class="play-big" id="heroPlay" aria-label="Play">${ICO_PLAY}</button>
        </div>
        ${trackTableHtml(tracks)}
      `);
      $('#heroPlay').addEventListener('click', () => Player.playTracks(tracks, 0));
      bindTrackTable(tracks);
    } catch (e) { render(empty('Couldn’t load album. ' + e.message)); }
  }

  async function goArtist(id) {
    render(spinner());
    try {
      const res = await fetch(`${API}/artist/${encodeURIComponent(id)}`);
      const d = await res.json();
      if (!d.ok) throw new Error('artist failed');
      const top = d.topTracks || [];
      const albums = d.albums || [];
      render(`
        <div class="hero" style="background:linear-gradient(180deg,#502828 0%,#2a1a1a 45%,var(--bg-2) 100%)">
          <img class="hero-art round" src="${d.thumbnail || ''}" alt="" onerror="this.style.visibility='hidden'"/>
          <div class="hero-meta">
            <div class="kind">Artist</div>
            <h1>${escapeHtml(d.name || '')}</h1>
            <div class="byline">${d.subscribers || ''} listeners</div>
          </div>
        </div>
        <div class="actions">
          <button class="play-big" id="heroPlay" aria-label="Play">${ICO_PLAY}</button>
        </div>
        ${top.length ? `<div class="section-head"><h2>Popular</h2></div>${trackTableHtml(top.slice(0, 10))}` : ''}
        ${albums.length ? `<div class="section-head"><h2>Discography</h2></div><div class="card-grid">${albums.map(a => cardHtml({ ...a, sub: (a.year ? a.year + ' · ' : '') + (a.type || 'Album') })).join('')}</div>` : ''}
      `);
      $('#heroPlay').addEventListener('click', () => Player.playTracks(top, 0));
      bindTrackTable(top);
      bindCardClicks();
    } catch (e) { render(empty('Couldn’t load artist. ' + e.message)); }
  }

  async function goLibrary() {
    render(spinner());
    try {
      const res = await fetch(`${API}/library`);
      const d = await res.json();
      if (!d.ok) throw new Error(d.error || 'library failed');
      const tracks = d.tracks || [];
      if (!tracks.length) { render(`<h1 class="page-title">Liked Songs</h1>${empty('Your library is empty. Connect your YouTube Music account via the <code>YTMUSIC_OAUTH_JSON</code> environment variable to see saved tracks here.')}`); return; }
      render(`
        <div class="hero" style="background:linear-gradient(180deg,#4b2b87 0%,#2a1a52 45%,var(--bg-2) 100%)">
          <div class="hero-art" style="display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#4527a0,#7b1fa2);color:#fff;font-weight:900;font-size:64px">♥</div>
          <div class="hero-meta"><div class="kind">Playlist</div><h1>Liked Songs</h1><div class="byline">${tracks.length} songs</div></div>
        </div>
        <div class="actions"><button class="play-big" id="heroPlay">${ICO_PLAY}</button></div>
        ${trackTableHtml(tracks)}
      `);
      $('#heroPlay').addEventListener('click', () => Player.playTracks(tracks, 0));
      bindTrackTable(tracks);
    } catch (e) {
      render(`<h1 class="page-title">Your Library</h1>${empty('To see your saved songs, set the <code>YTMUSIC_OAUTH_JSON</code> environment variable in Vercel. Run <code>ytmusicapi oauth</code> locally and paste the resulting JSON as the value. <br><br><em>' + escapeHtml(e.message) + '</em>')}`);
    }
  }

  function goQueue() {
    if (!state.queue.length) { render(`<h1 class="page-title">Queue</h1>${empty('Play something to build a queue.')}`); return; }
    render(`
      <h1 class="page-title">Queue</h1>
      <div class="section-head"><h2>Now playing</h2></div>
      ${state.queue[state.index] ? trackTableHtml([state.queue[state.index]]) : ''}
      <div class="section-head" style="margin-top:28px"><h2>Up next (${Math.max(0, state.queue.length - 1)})</h2></div>
      ${trackTableHtml(state.queue.filter((_, i) => i !== state.index), false)}
    `);
    bindTrackTable(state.queue);
  }

  // ---------- Router ----------
  function parseHash() {
    const h = (location.hash || '#home').replace(/^#/, '');
    const [route, ...rest] = h.split('/');
    return { route, params: rest };
  }
  function navigate() {
    const { route, params } = parseHash();
    $$('.nav-link, .mob-btn').forEach(el => el.classList.toggle('active', el.dataset.route === route));
    // Hide search bar on non-search routes on mobile-ish
    const sw = $('#searchWrap');
    sw.style.display = (route === 'search') ? '' : (window.innerWidth <= 860 ? 'none' : '');
    switch (route) {
      case 'home':     return goHome();
      case 'search':   return goSearch(decodeURIComponent(params[0] || $('#searchInput').value || ''), state.searchType);
      case 'playlist': return goPlaylist(params[0]);
      case 'album':    return goAlbum(params[0]);
      case 'artist':   return goArtist(params[0]);
      case 'library':  return goLibrary();
      case 'queue':    return goQueue();
      default:         return goHome();
    }
  }
  window.addEventListener('hashchange', navigate);

  // Back/forward buttons in topbar
  const hist = []; let histPtr = -1, navigating = false;
  const origNav = navigate;
  window.navigate = function() {
    if (!navigating) {
      hist.splice(histPtr + 1);
      hist.push(location.hash || '#home');
      histPtr = hist.length - 1;
      if (hist.length > 50) hist.shift(), histPtr--;
    }
    origNav();
  };
  $('#backBtn').addEventListener('click', () => {
    if (histPtr > 0) { navigating = true; histPtr--; location.hash = hist[histPtr]; setTimeout(() => navigating = false, 40); }
    else if (hist.length) { history.back(); }
  });
  $('#fwdBtn').addEventListener('click', () => {
    if (histPtr < hist.length - 1) { navigating = true; histPtr++; location.hash = hist[histPtr]; setTimeout(() => navigating = false, 40); }
    else { history.forward(); }
  });

  // ---------- Search input ----------
  const searchInput = $('#searchInput');
  const runSearch = debounce((v) => {
    v = v.trim();
    if (!v) { navigate(); return; }
    location.hash = `#search/${encodeURIComponent(v)}`;
  }, 300);
  searchInput.addEventListener('input', e => runSearch(e.target.value));
  searchInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { runSearch.flush && runSearch.flush(); runSearch(e.target.value); }
  });

  // ---------- Sidebar library items ----------
  $('#libList').addEventListener('click', e => {
    const row = e.target.closest('.lib-item');
    if (!row) return;
    if (row.dataset.playlist) location.hash = `#playlist/${row.dataset.playlist}`;
  });

  // ---------- HTML builders ----------
  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function cardHtml(c) {
    const id = c.playlistId || c.browseId || c.videoId || '';
    const kind = c.resultType || 'playlist';
    const title = c.title || c.name || '';
    const sub = c.sub || c.author || c.artist || c.description || '';
    const round = kind === 'artist';
    const click = kind === 'playlist' ? `#playlist/${c.playlistId || c.browseId}`
                : kind === 'album'  ? `#album/${c.browseId}`
                : kind === 'artist' ? `#artist/${c.browseId}`
                : kind === 'song'   ? `#search/${encodeURIComponent(title)}`
                : `#search/${encodeURIComponent(title)}`;
    return `
      <div class="card" data-href="${click}" data-kind="${kind}" data-id="${id}">
        <img class="card-art ${round ? 'round' : ''}" src="${c.thumbnail || ''}" alt="" onerror="this.style.background='var(--surface-2)';this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22><rect width=%22200%22 height=%22200%22 fill=%22%23282828%22/></svg>'"/>
        <button class="card-play" aria-label="Play ${escapeHtml(title)}">${ICO_PLAY}</button>
        <div class="card-title" title="${escapeHtml(title)}">${escapeHtml(title)}</div>
        <div class="card-sub">${escapeHtml(sub)}</div>
      </div>`;
  }
  function bindCardClicks() {
    $$('.card', content).forEach(card => {
      const href = card.dataset.href;
      const kind = card.dataset.kind;
      const playBtn = $('.card-play', card);
      playBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        // Try to play immediately
        if (kind === 'playlist' || kind === 'album') {
          const id = card.dataset.id;
          const ep = kind === 'playlist' ? 'playlist' : 'album';
          try {
            toast('Loading…');
            const r = await fetch(`${API}/${ep}/${encodeURIComponent(id)}`);
            const d = await r.json();
            if (d.ok && d.tracks?.length) Player.playTracks(d.tracks, 0);
          } catch { toast('Couldn’t start playback'); }
        } else if (kind === 'artist') {
          const r = await fetch(`${API}/artist/${encodeURIComponent(card.dataset.id)}`);
          const d = await r.json();
          if (d.ok && d.topTracks?.length) Player.playTracks(d.topTracks, 0);
        } else {
          location.hash = href;
        }
      });
      card.addEventListener('click', () => location.hash = href);
    });
  }
  function trackTableHtml(tracks, showAlbum = true) {
    if (!tracks.length) return empty('No tracks');
    const rows = tracks.map((t, i) => `
      <tr class="track-row" data-video-id="${escapeHtml(t.videoId)}" data-idx="${i}">
        <td class="num"><div class="t-num"><span class="idx">${i + 1}</span>${ICO_PLAY_SM}</div></td>
        <td>
          <div class="track-cell">
            <img class="t-thumb" src="${t.thumbnail || ''}" alt="" onerror="this.style.visibility='hidden'"/>
            <div style="min-width:0">
              <div class="t-title">${escapeHtml(t.title || '')}</div>
              <div class="t-artist">${t.artistIds?.[0] ? `<a href="#artist/${t.artistIds[0]}">${escapeHtml(t.artist || '')}</a>` : escapeHtml(t.artist || '')}</div>
            </div>
          </div>
        </td>
        ${showAlbum ? `<td class="t-album">${t.albumId ? `<a href="#album/${t.albumId}">${escapeHtml(t.album || '')}</a>` : escapeHtml(t.album || '')}</td>` : ''}
        <td class="len">${fmt(t.duration)}</td>
      </tr>`).join('');
    return `
      <table class="track-table">
        <thead><tr>
          <th class="num">#</th>
          <th>Title</th>
          ${showAlbum ? '<th class="album">Album</th>' : ''}
          <th class="len"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1.5a6.5 6.5 0 100 13 6.5 6.5 0 000-13zM0 8a8 8 0 1116 0A8 8 0 010 8z"/><path d="M8.75 4.5a.75.75 0 00-1.5 0v3.5l2.5 1.5a.75.75 0 10.75-1.3l-1.75-1.05V4.5z"/></svg></th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  }
  function bindTrackTable(tracks) {
    $$('.track-row', content).forEach(tr => {
      const idx = parseInt(tr.dataset.idx, 10);
      tr.addEventListener('dblclick', () => Player.playTracks(tracks, idx));
      tr.addEventListener('click', (e) => {
        // ignore clicks on artist/album links
        if (e.target.tagName === 'A') return;
        Player.playTracks(tracks, idx);
      });
    });
    highlightPlayingRow();
  }

  const GENRE_CARDS = [
    { name: 'Pop',        c1: '#e11d48', c2: '#fb7185' },
    { name: 'Hip-Hop',    c1: '#7c3aed', c2: '#a78bfa' },
    { name: 'Rock',       c1: '#b91c1c', c2: '#f87171' },
    { name: 'Electronic', c1: '#0ea5e9', c2: '#38bdf8' },
    { name: 'Jazz',       c1: '#0891b2', c2: '#67e8f9' },
    { name: 'Classical',  c1: '#a16207', c2: '#fbbf24' },
    { name: 'R&B',        c1: '#be185d', c2: '#f472b6' },
    { name: 'Indie',      c1: '#15803d', c2: '#4ade80' },
    { name: 'Latin',      c1: '#ea580c', c2: '#fb923c' },
    { name: 'K-Pop',      c1: '#db2777', c2: '#f0abfc' },
    { name: 'Country',    c1: '#65a30d', c2: '#a3e635' },
    { name: 'Metal',      c1: '#475569', c2: '#94a3b8' },
  ];

  // Keyboard shortcuts
  window.addEventListener('keydown', (e) => {
    if (e.target.matches('input, textarea')) return;
    if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
    else if (e.code === 'ArrowRight' && e.shiftKey) nextTrack(false);
    else if (e.code === 'ArrowLeft'  && e.shiftKey) prevTrack();
    else if (e.code === 'ArrowRight') { audio.currentTime = clamp(audio.currentTime + 5, 0, audio.duration || 0); }
    else if (e.code === 'ArrowLeft')  { audio.currentTime = clamp(audio.currentTime - 5, 0, audio.duration || 0); }
    else if (e.code === 'ArrowUp')    { e.preventDefault(); vol.value = String(clamp(parseInt(vol.value,10)+5,0,100)); vol.dispatchEvent(new Event('input')); }
    else if (e.code === 'ArrowDown')  { e.preventDefault(); vol.value = String(clamp(parseInt(vol.value,10)-5,0,100)); vol.dispatchEvent(new Event('input')); }
    else if (e.key === 'm' || e.key === 'M') { muteBtn.click(); }
  });

  // Init
  window.addEventListener('resize', () => {
    const sw = $('#searchWrap');
    const r = parseHash().route;
    sw.style.display = (r === 'search') ? '' : (window.innerWidth <= 860 ? 'none' : '');
  });

  // If loaded with a bare hash, kick off router; else go home.
  if (location.hash) navigate(); else { location.hash = '#home'; navigate(); }

  // Expose for debugging
  window.__NRN = { state, audio };
})();
</script>
</body>
</html>
