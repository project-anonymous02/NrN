<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="theme-color" content="#121212" />
<title>NRN Music</title>
<style>
  /* ---------- Reset & Base ---------- */
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;width:100%;overflow:hidden;background:#121212;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;font-size:15px;line-height:1.5}
  body{display:flex;flex-direction:column;max-width:640px;margin:0 auto;position:relative}
  input,button{font:inherit;color:inherit}
  input{font-size:16px} /* cegah zoom iOS */
  button{border:0;background:none;cursor:pointer;touch-action:manipulation;min-height:44px;min-width:44px}
  a{color:inherit;text-decoration:none}
  img{max-width:100%;display:block}

  /* ---------- Safe Area ---------- */
  :root{
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
    --sar: env(safe-area-inset-right, 0px);
    --green: #1ed760;
    --green-dark: #16a34a;
    --bg: #121212;
    --card: #181818;
    --card-hover: #282828;
    --muted: #b3b3b3;
    --border: #2a2a2a;
    --danger: #e22134;
  }

  /* ---------- Layout Utama (Mobile Only) ---------- */
  #app{flex:1;display:flex;flex-direction:column;min-height:0;
    padding-top: var(--sat);
    padding-left: var(--sal);
    padding-right: var(--sar);
  }
  #view{flex:1;overflow-y:auto;min-height:0;padding:14px 14px 170px 14px;-webkit-overflow-scrolling:touch}
  #view::-webkit-scrollbar{display:none}

  /* ---------- Top Bar ---------- */
  .topbar{display:flex;align-items:center;gap:10px;padding:6px 2px 14px 2px;position:sticky;top:0;background:linear-gradient(180deg,#121212 60%, transparent);z-index:5}
  .topbar h1{font-size:22px;font-weight:800;flex:1;letter-spacing:-.02em}
  .icon-btn{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff}
  .icon-btn:active{background:#ffffff14}

  /* ---------- Cards & Grid ---------- */
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:10px}
  .card{background:var(--card);border-radius:10px;overflow:hidden;transition:background .15s;position:relative}
  .card:active{background:var(--card-hover)}
  .card .cover{aspect-ratio:1/1;background:#222;position:relative}
  .card .cover img{width:100%;height:100%;object-fit:cover}
  .card .body{padding:10px}
  .card .title{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .sub{color:var(--muted);font-size:12px;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .play-fab{position:absolute;right:10px;bottom:70px;width:44px;height:44px;border-radius:50%;background:var(--green);color:#000;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px #00000066;opacity:0;transform:translateY(6px);transition:all .18s}
  .card:active .play-fab{opacity:1;transform:none}

  /* ---------- Track List ---------- */
  .track-list{margin-top:6px;display:flex;flex-direction:column}
  .track{display:flex;align-items:center;gap:12px;padding:10px 6px;border-radius:8px;min-height:56px}
  .track:active{background:#ffffff0d}
  .track .num{width:22px;color:var(--muted);font-size:13px;text-align:center;flex-shrink:0}
  .track .thumb{width:44px;height:44px;border-radius:4px;overflow:hidden;background:#222;flex-shrink:0}
  .track .info{flex:1;min-width:0}
  .track .t-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .track .t-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .track .dur{color:var(--muted);font-size:12px;flex-shrink:0}
  .track.playing .t-title{color:var(--green)}

  /* ---------- Bottom Nav ---------- */
  #bottom-nav{
    position:fixed;left:0;right:0;bottom:0;
    background:linear-gradient(180deg, transparent 0%, #121212 25%, #0a0a0a 100%);
    padding: 6px calc(12px + var(--sal)) calc(6px + var(--sab)) calc(12px + var(--sar));
    z-index:30;max-width:640px;margin:0 auto;
    display:grid;grid-template-columns:repeat(4,1fr);gap:4px;
  }
  .nav-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;font-weight:600;padding:6px 2px;border-radius:10px}
  .nav-btn.active{color:#fff}
  .nav-btn:active{background:#ffffff0d}
  .nav-btn svg{width:24px;height:24px}

  /* ---------- Mini Player ---------- */
  #miniplayer{
    position:fixed;left:0;right:0;
    bottom: calc(62px + var(--sab));
    max-width:640px;margin:0 auto;
    background:#2a2a2a;
    margin-left:var(--sal);margin-right:var(--sar);
    border-radius:12px;
    z-index:25;
    display:flex;align-items:center;gap:10px;
    padding:8px 8px 8px 8px;
    box-shadow:0 -6px 24px #00000088;
    transform: translateY(140%);
    transition: transform .25s ease;
  }
  #miniplayer.show{transform: none}
  #miniplayer .thumb{width:52px;height:52px;border-radius:8px;overflow:hidden;background:#333;flex-shrink:0}
  #miniplayer .meta{flex:1;min-width:0}
  #miniplayer .m-title{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #miniplayer .m-artist{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #miniplayer .controls{display:flex;align-items:center;gap:4px}
  .play-btn{width:48px;height:48px;border-radius:50%;background:#fff;color:#000;display:inline-flex;align-items:center;justify-content:center}
  .play-btn:active{background:#ddd;transform:scale(.96)}

  /* Progress bar mini */
  .progress{position:absolute;left:0;right:0;bottom:0;height:2px;background:#ffffff1a;border-radius:0 0 12px 12px;overflow:hidden}
  .progress > div{height:100%;background:var(--green);width:0%;transition:width .25s linear}

  /* ---------- Form & Input ---------- */
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
  .input{
    width:100%;padding:13px 14px;border-radius:8px;
    background:#1f1f1f;border:1px solid #2e2e2e;color:#fff;
    outline:none;
  }
  .input:focus{border-color:var(--green)}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    width:100%;padding:14px 18px;border-radius:9999px;font-weight:800;letter-spacing:.01em;
    min-height:50px;
  }
  .btn-primary{background:var(--green);color:#000}
  .btn-primary:active{background:var(--green-dark);color:#fff}
  .btn-secondary{background:#ffffff14;color:#fff}
  .btn-secondary:active{background:#ffffff22}
  .btn-ghost{background:transparent;color:#fff;border:1px solid #ffffff33}
  .btn-danger{background:var(--danger);color:#fff}

  /* ---------- Alert / Toast ---------- */
  .toast{
    position:fixed;left:50%;top: calc(20px + var(--sat));
    transform: translateX(-50%) translateY(-120%);
    background:#e22134;color:#fff;padding:12px 18px;border-radius:10px;
    font-size:14px;font-weight:600;z-index:99;max-width:90%;
    box-shadow:0 8px 24px #00000066;transition: transform .25s ease;
  }
  .toast.show{transform: translateX(-50%) translateY(0)}
  .toast.ok{background:var(--green);color:#000}

  /* ---------- Login / Onboarding ---------- */
  .onboard{padding:10px 4px 40px 4px}
  .logo{font-size:30px;font-weight:900;letter-spacing:-.03em;margin-bottom:4px}
  .logo span{color:var(--green)}
  .subtitle{color:var(--muted);margin-bottom:22px}
  .card-box{background:var(--card);border-radius:14px;padding:16px;margin-bottom:14px;border:1px solid var(--border)}
  .card-box h3{font-size:16px;margin-bottom:8px}
  .card-box p{font-size:13px;color:var(--muted);line-height:1.55;margin-bottom:10px}
  .code-box{
    background:#000;color:var(--green);
    font-family:"SF Mono",Menlo,Consolas,monospace;
    font-size:28px;font-weight:800;letter-spacing:.25em;
    text-align:center;padding:18px;border-radius:10px;
    user-select:all;margin:10px 0;
  }
  .link-btn{color:var(--green);font-weight:700;font-size:14px;word-break:break-all}
  .steps{list-style:none;counter-reset:s}
  .steps li{counter-increment:s;padding:10px 0 10px 34px;position:relative;font-size:14px;color:#eaeaea}
  .steps li::before{
    content:counter(s);position:absolute;left:0;top:8px;
    width:24px;height:24px;border-radius:50%;background:var(--green);color:#000;
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px
  }
  .muted{color:var(--muted)}
  .hr{height:1px;background:#222;margin:18px 0}
  .row{display:flex;gap:10px;align-items:center}
  .spacer{flex:1}

  /* Loading dots */
  .dots::after{content:"";display:inline-block;animation:dots 1.2s steps(4,end) infinite;width:1em;text-align:left}
  @keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
</style>
</head>
<body>

<div id="app">
  <div id="view"></div>
</div>

<!-- Mini Player -->
<div id="miniplayer">
  <div class="thumb" id="mp-thumb"></div>
  <div class="meta">
    <div class="m-title" id="mp-title">—</div>
    <div class="m-artist" id="mp-artist">—</div>
  </div>
  <div class="controls">
    <button class="icon-btn" id="btn-prev" aria-label="Previous">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
    </button>
    <button class="play-btn" id="btn-play" aria-label="Play">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" id="ic-play"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button class="icon-btn" id="btn-next" aria-label="Next">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
    </button>
  </div>
  <div class="progress"><div id="mp-bar"></div></div>
</div>

<!-- Bottom Nav -->
<nav id="bottom-nav">
  <button class="nav-btn active" data-view="home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1z"/></svg>
    Home
  </button>
  <button class="nav-btn" data-view="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    Search
  </button>
  <button class="nav-btn" data-view="library">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
    Library
  </button>
  <button class="nav-btn" data-view="queue">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="15" y2="18"/><circle cx="4" cy="6" r="1" fill="currentColor"/><circle cx="4" cy="12" r="1" fill="currentColor"/><circle cx="4" cy="18" r="1" fill="currentColor"/></svg>
    Queue
  </button>
</nav>

<!-- Audio (hidden) -->
<audio id="audio" preload="metadata"></audio>

<!-- Toast -->
<div id="toast" class="toast"></div>

<script>
/* ============================================================
   NRN MUSIC v2.1 — Frontend Mobile-Only
   ============================================================ */
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const LS = localStorage;
const API = ""; // relative path — Vercel route /api/* ke api/index.py

/* ---------- State ---------- */
const State = {
  view: "home",
  queue: [],       // {videoId, title, artist, thumbnail}
  qIndex: -1,
  playing: false,
  deviceAuth: null, // {device_code, user_code, verification_url, expires_in, interval, client_id, client_secret}
  pollTimer: null,
};

/* ---------- Utils ---------- */
function toast(msg, ok=false){
  const t = $("#toast");
  t.textContent = msg;
  t.classList.toggle("ok", !!ok);
  t.classList.add("show");
  clearTimeout(t._tm);
  t._tm = setTimeout(()=>t.classList.remove("show"), 3200);
}
async function api(path, opts={}){
  const headers = {"Content-Type":"application/json", ...(opts.headers||{})};
  const tk = LS.getItem("ytm_token");
  if(tk) headers["Authorization"] = "Bearer " + tk;
  const res = await fetch(API + path, {...opts, headers});
  let data = null;
  try{ data = await res.json(); }catch(e){ data = {detail:"Response tidak valid"}; }
  if(!res.ok){
    const msg = data?.detail || ("HTTP " + res.status);
    if(res.status === 401 && msg === "LOGIN_REQUIRED"){
      // biarkan caller tangani
    }
    throw new Error(msg);
  }
  return data;
}
function fmtDur(s){
  if(!s) return "0:00";
  s = Math.floor(s);
  const m = Math.floor(s/60), sec = s%60;
  return m + ":" + (sec<10?"0":"") + sec;
}
function thumbUrl(t, w=160){
  if(!t) return "";
  if(typeof t === "string") return t;
  if(Array.isArray(t)) t = t[t.length-1];
  if(t.url) return t.url;
  if(t.thumbnails) return thumbUrl(t.thumbnails, w);
  return "";
}
function bestArtists(arr){
  if(!arr) return "Unknown";
  if(Array.isArray(arr)) return arr.map(a=>a.name||a).filter(Boolean).join(", ") || "Unknown";
  return String(arr);
}

/* ---------- Auth Helpers ---------- */
function hasCreds(){ return !!(LS.getItem("ytm_cid") && LS.getItem("ytm_csc")); }
function isLoggedIn(){ return !!LS.getItem("ytm_token"); }
function logout(){
  LS.removeItem("ytm_token");
  State.queue = []; State.qIndex = -1; State.playing = false;
  $("#audio").pause(); $("#audio").src = "";
  $("#miniplayer").classList.remove("show");
  render();
}

/* ---------- Router / Bottom Nav ---------- */
$$("#bottom-nav .nav-btn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    State.view = btn.dataset.view;
    $$("#bottom-nav .nav-btn").forEach(b=>b.classList.toggle("active", b===btn));
    render();
    $("#view").scrollTop = 0;
  });
});

/* ---------- Player ---------- */
const AUDIO = $("#audio");
AUDIO.addEventListener("timeupdate", ()=>{
  if(AUDIO.duration){
    $("#mp-bar").style.width = (AUDIO.currentTime / AUDIO.duration * 100) + "%";
  }
});
AUDIO.addEventListener("ended", ()=> playNext());
AUDIO.addEventListener("error", ()=>{
  toast("Gagal putar: HTTP 403 / region diblokir — coba lagu lain");
  setTimeout(playNext, 900);
});

$("#btn-play").addEventListener("click", ()=>{
  if(State.qIndex < 0) return;
  if(AUDIO.paused) AUDIO.play().catch(e=>toast("Tidak bisa play: "+e.message));
  else AUDIO.pause();
});
AUDIO.addEventListener("play", ()=>{
  State.playing = true;
  $("#ic-play").innerHTML = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';
});
AUDIO.addEventListener("pause", ()=>{
  State.playing = false;
  $("#ic-play").innerHTML = '<path d="M8 5v14l11-7z"/>';
});
$("#btn-next").addEventListener("click", playNext);
$("#btn-prev").addEventListener("click", playPrev);

async function playAt(i){
  if(i<0 || i>=State.queue.length) return;
  State.qIndex = i;
  const t = State.queue[i];
  $("#mp-title").textContent = t.title;
  $("#mp-artist").textContent = t.artist;
  $("#mp-thumb").innerHTML = t.thumbnail
    ? `<img src="${t.thumbnail}" alt="" style="width:100%;height:100%;object-fit:cover"/>`
    : "";
  $("#miniplayer").classList.add("show");
  // Selalu fetch URL FRESH sebelum play — URL dari search expired cepat
  try{
    const res = await api("/api/song/" + encodeURIComponent(t.videoId));
    if(!res.stream_url) throw new Error("Tidak ada URL stream");
    AUDIO.src = res.stream_url;
    await AUDIO.play().catch(e=>{
      toast("Play gagal (403/blocked), coba lagu lain");
      setTimeout(playNext, 700);
    });
  }catch(e){
    toast("Gagal muat lagu: " + e.message);
  }
  renderQueueHighlight();
}
function playNext(){
  if(State.queue.length === 0) return;
  const next = (State.qIndex + 1) % State.queue.length;
  playAt(next);
}
function playPrev(){
  if(AUDIO.currentTime > 3){ AUDIO.currentTime = 0; return; }
  const prev = (State.qIndex - 1 + State.queue.length) % State.queue.length;
  playAt(prev);
}
function enqueueAndPlay(list){
  if(!list || !list.length){ toast("Tidak ada lagu"); return; }
  State.queue = list.map(t => ({
    videoId: t.videoId || (t.videoDetails?.videoId),
    title: t.title || t.name || t.videoDetails?.title || "Unknown",
    artist: bestArtists(t.artists || t.author || t.videoDetails?.author),
    thumbnail: thumbUrl(t.thumbnails || t.thumbnail || t.videoDetails?.thumbnail?.thumbnails),
    duration: t.duration_seconds || t.lengthSeconds || 0,
  })).filter(x=>x.videoId);
  if(State.queue.length === 0){ toast("Tidak ada lagu valid"); return; }
  playAt(0);
  if(State.view === "queue") render();
}
function renderQueueHighlight(){
  $$(".track").forEach((el, i)=>{
    el.classList.toggle("playing", i === State.qIndex);
  });
}

/* ============================================================
   RENDER SETIAP VIEW
   ============================================================ */
function render(){
  const v = State.view;
  if(v === "home") renderHome();
  else if(v === "search") renderSearch();
  else if(v === "library") renderLibrary();
  else if(v === "queue") renderQueue();
}

/* ---------- VIEW: HOME ---------- */
async function renderHome(){
  const V = $("#view");
  V.innerHTML = `
    <div class="topbar">
      <h1>Good <span style="color:var(--green)">Evening</span></h1>
      <button class="icon-btn" data-goto="settings" title="Settings">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
    <h2 style="font-size:18px;font-weight:800;margin:6px 0 4px 2px">Trending</h2>
    <div class="muted" style="font-size:13px;margin-bottom:16px" id="home-status">Memuat<span class="dots"></span></div>
    <div id="home-shelves"></div>
  `;
  $('[data-goto="settings"]').addEventListener("click", ()=>{ State.view="settings"; render(); });

  try{
    const res = await api("/api/home");
    const shelves = Array.isArray(res?.data) ? res.data : [];
    const wrap = $("#home-shelves");
    if(!shelves.length){ wrap.innerHTML = '<p class="muted">Feed kosong — coba Search.</p>'; $("#home-status").remove(); return; }
    $("#home-status").remove();
    shelves.slice(0, 6).forEach((sh, idx)=>{
      if(!sh?.title || !Array.isArray(sh.contents)) return;
      const items = sh.contents.filter(c=>c.playlistId||c.browseId).slice(0,6);
      if(!items.length) return;
      const sec = document.createElement("section");
      sec.style.marginTop = idx===0 ? "4px" : "22px";
      sec.innerHTML = `<h2 style="font-size:18px;font-weight:800;margin:0 2px 8px 2px">${sh.title}</h2>`;
      const grid = document.createElement("div");
      grid.className = "grid";
      items.forEach(it=>{
        const pid = it.playlistId;
        const bid = it.browseId;
        const thumb = thumbUrl(it.thumbnails);
        const title = it.title || "Untitled";
        const sub = it.subtitle || it.description || (pid?"Playlist":"Browse");
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="cover">${thumb?`<img src="${thumb}" alt="" loading="lazy"/>`:""}
            <button class="play-fab" aria-label="Play">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            </button>
          </div>
          <div class="body"><div class="title">${title}</div><div class="sub">${sub}</div></div>`;
        card.addEventListener("click", async (e)=>{
          if(e.target.closest(".play-fab") || !pid && !bid) return;
          if(pid){ State.view="playlist"; renderPlaylist(pid, title); }
          else if(bid){
            // coba tebak tipe browseId
            if(bid.startsWith("MPRE") || bid.startsWith("VL")){ State.view="playlist"; renderPlaylist(bid, title); }
            else{ State.view="album"; renderAlbum(bid, title); }
          }
        });
        card.querySelector(".play-fab").addEventListener("click", async (e)=>{
          e.stopPropagation();
          if(!pid) return;
          try{
            const r = await api("/api/playlist/" + pid);
            const tracks = r?.data?.tracks || [];
            enqueueAndPlay(tracks);
          }catch(err){ toast(err.message); }
        });
        grid.appendChild(card);
      });
      sec.appendChild(grid);
      wrap.appendChild(sec);
    });
  }catch(err){
    $("#home-status").textContent = "";
    $("#home-shelves").innerHTML = `<div class="card-box" style="border-color:#e2213444">
      <h3 style="color:#ff6b6b">Gagal muat Home</h3>

}

async function doSearch(q){
  const R = $("#s-res");
  R.innerHTML = '<p class="muted">Mencari<span class="dots"></span></p>';
  try{
    const res = await api("/api/search?q=" + encodeURIComponent(q) + "&filter=songs");
    const items = res?.data || [];
    if(!items.length){ R.innerHTML = '<p class="muted">Tidak ditemukan.</p>'; return; }
    const list = document.createElement("div");
    list.className = "track-list";
    items.forEach((it, i)=>{
      const row = document.createElement("div");
      row.className = "track";
      row.innerHTML = `

        <div class="dur">${fmtDur(it.duration_seconds||0)}</div>`;
      row.addEventListener("click", ()=> enqueueAndPlay(items.slice(i)));
      list.appendChild(row);
    });
    R.innerHTML = ""; R.appendChild(list);
  }catch(err){
    R.innerHTML = `<p class="muted" style="color:#ff6b6b">Gagal: ${err.message}</p>`;
  }
}

function mkShelf(title, items, kind){
  const sec = document.createElement("section");
  sec.style.marginTop = "20px";
  sec.innerHTML = `<h2 style="font-size:17px;font-weight:800;margin:0 2px 10px 2px">${title}</h2>`;
  if(kind === "track"){
    const list = document.createElement("div"); list.className = "track-list";
    items.forEach((t,i)=>{
      const row = document.createElement("div"); row.className = "track";
      row.innerHTML = `
        <div class="num">${i+1}</div>
        <div class="thumb">${t.thumbnails?`<img src="${thumbUrl(t.thumbnails)}" loading="lazy"/>`:""}</div>
        <div class="info"><div class="t-title">${t.title||""}</div><div class="t-sub">${bestArtists(t.artists)}</div></div>
        <div class="dur">${fmtDur(t.duration_seconds||0)}</div>`;
      row.addEventListener("click", ()=> enqueueAndPlay(items.slice(i)));
      list.appendChild(row);
    });
    sec.appendChild(list);
  }else{
    const grid = document.createElement("div"); grid.className = "grid";
    items.forEach(it=>{
      const card = document.createElement("div"); card.className = "card";
      const thumb = thumbUrl(it.thumbnails);
      const t = it.title || "Untitled";
      const sub = kind === "artist" ? "Artis" : (it.subtitle || (kind==="playlist"?"Playlist":"Album"));
      const id = it.playlistId || it.browseId;
      card.innerHTML = `
        <div class="cover">${thumb?`<img src="${thumb}" loading="lazy"/>`:""}
          <button class="play-fab"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
        </div>
        <div class="body"><div class="title">${t}</div><div class="sub">${sub}</div></div>`;
      card.addEventListener("click", (e)=>{
        if(e.target.closest(".play-fab")) return;
        if(kind === "playlist" || it.playlistId){ State.view="playlist"; renderPlaylist(id, t); }
        else if(kind === "album"){ State.view="album"; renderAlbum(id, t); }
        else if(kind === "artist"){ State.view="artist"; renderArtist(id, t); }
      });
      const pf = card.querySelector(".play-fab");
      pf.addEventListener("click", async (e)=>{
        e.stopPropagation();
        try{
          const r = kind === "playlist" || it.playlistId
            ? await api("/api/playlist/" + id)
            : await api("/api/album/" + id);
          enqueueAndPlay(r?.data?.tracks || []);
        }catch(err){ toast(err.message); }
      });
      grid.appendChild(card);
    });
    sec.appendChild(grid);
  }
  return sec;
}

    const cid = $("#cid").value.trim();
    const csc = $("#csc").value.trim();
    if(!cid || !csc){ toast("Client ID & Secret wajib diisi"); return; }
    LS.setItem("ytm_cid", cid);
    LS.setItem("ytm_csc", csc);
    toast("Credentials tersimpan", true);
    render();
  });
  const bl = $("#btn-login");
  if(bl) bl.addEventListener("click", ()=>{ State.view="login"; render(); });
  const bo = $("#btn-logout");
  if(bo) bo.addEventListener("click", ()=>{ if(confirm("Yakin logout?")) logout(); toast("Logged out", true); });
}

/* ---------- VIEW: LOGIN (Device Flow) ---------- */
async function renderLogin(){
  const V = $("#view");
  if(!hasCreds()){
    V.innerHTML = `<div class="topbar">
      <button class="icon-btn" onclick="State.view='library';render()">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button><h1>Login</h1></div>
      <div class="card-box" style="margin-top:10px">
        <h3>⚠️ Belum ada Credentials</h3>
        <p>Simpan Client ID + Client Secret di Settings terlebih dahulu.</p>
        <div style="height:10px"></div>
        <button class="btn btn-primary" onclick="State.view='settings';render()">Buka Settings</button>
      </div>`;
    return;
  }
  V.innerHTML = `
    <div class="topbar">
      <button class="icon-btn" onclick="State.view='library';render()">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <h1>Login YouTube Music</h1>
    </div>
    <div class="onboard">
      <div class="logo">NRN <span>Music</span></div>
      <p class="subtitle">Izin akses Library akun YouTube Music kamu.</p>

      <div id="login-body">
        <p class="muted">Meminta kode device<span class="dots"></span></p>
      </div>
    </div>`;

  try{
    const res = await api("/api/auth/device", {
      method:"POST",
      body: JSON.stringify({
        client_id: LS.getItem("ytm_cid"),
        client_secret: LS.getItem("ytm_csc"),
      })
    });
    State.deviceAuth = res;
    const url = res.verification_url || res.verification_uri || "https://www.google.com/device";
    const code = res.user_code;
    $("#login-body").innerHTML = `
      <ol class="steps">
        <li>Buka link ini di browser:</li>
      </ol>
      <a class="link-btn" href="${url}" target="_blank" rel="noopener">🔗 ${url}</a>
      <div style="height:14px"></div>
      <ol class="steps" start="2"><li>Masukkan kode berikut:</li></ol>
      <div class="code-box" id="ucode">${code}</div>
      <button class="btn btn-secondary" id="copy-code">📋 Salin Kode</button>
      <div style="height:14px"></div>
      <ol class="steps" start="3"><li>Login pakai akun YouTube Music kamu → klik <strong>Allow</strong></li></ol>
      <div style="height:10px"></div>
      <p class="muted" id="poll-st">Menunggu konfirmasi<span class="dots"></span></p>
      <button class="btn btn-ghost" id="cancel">Batal</button>
    `;
    $("#copy-code").addEventListener("click", async ()=>{
      try{ await navigator.clipboard.writeText(code); toast("Kode disalin", true); }
      catch(e){ toast("Gagal salin — salin manual"); }
    });
    $("#cancel").addEventListener("click", ()=>{ stopPoll(); State.view="library"; render(); });

    startPolling();
  }catch(err){
    $("#login-body").innerHTML = `<div class="card-box" style="border-color:#e2213444">
      <h3 style="color:#ff6b6b">Gagal minta kode</h3>
      <p><strong>Penyebab paling sering:</strong></p>
      <ul style="padding-left:18px;color:#ddd;font-size:13px;line-height:1.7;margin-top:6px">
        <li>Client ID / Client Secret salah</li>
        <li>Tipe OAuth Client <strong>bukan TVs and Limited Input devices</strong> (harus tipe ini!)</li>
        <li>YouTube Data API v3 belum di-Enable</li>
      </ul>
      <p style="margin-top:8px"><strong>Detail:</strong> ${err.message}</p>
      <div style="height:10px"></div>
      <button class="btn btn-secondary" onclick="State.view='settings';render()">Cek Settings</button>
      <div style="height:8px"></div>
      <button class="btn btn-ghost" onclick="renderLogin()">Coba Lagi</button>
    </div>`;
  }
}
function startPolling(){
  stopPoll();
  const interval = (State.deviceAuth.interval || 5) * 1000;
  const tick = async ()=>{
    if(!State.deviceAuth) return;
    try{
      const res = await api("/api/auth/token", {
        method:"POST",
        body: JSON.stringify({
          client_id: State.deviceAuth.client_id || LS.getItem("ytm_cid"),
          client_secret: State.deviceAuth._client_secret || State.deviceAuth.client_secret || LS.getItem("ytm_csc"),
          device_code: State.deviceAuth.device_code,
          grant_type: "urn:ietf:params:oauth:grant-type:device_code",
        })
      });
      if(res.status === "pending" || res.status === "slow_down"){
        State.pollTimer = setTimeout(tick, res.status==="slow_down"? interval*2 : interval);
        return;
      }
      // Berhasil dapat token
      LS.setItem("ytm_token", JSON.stringify(res));
      stopPoll();
      toast("✅ Login berhasil!", true);
      State.view = "library";
      render();
    }catch(err){
      const m = err.message || "";
      if(/pending|slow_down/i.test(m)){
        State.pollTimer = setTimeout(tick, interval);
        return;
      }
      if(/expired/i.test(m)){
        stopPoll();
        $("#poll-st").textContent = "❌ Kode expired — klik Coba Lagi";
        return;
      }
      stopPoll();
      $("#poll-st").innerHTML = `<span style="color:#ff6b6b">Gagal: ${m}</span>`;
    }
  };
  State.pollTimer = setTimeout(tick, Math.max(interval, 3500));
}
function stopPoll(){
  if(State.pollTimer){ clearTimeout(State.pollTimer); State.pollTimer = null; }
  State.deviceAuth = null;
}

/* ---------- Boot ---------- */
// Cek token expired & refresh jika perlu (best effort)
(function boot(){
  try{
    const raw = LS.getItem("ytm_token");
    if(raw){
      const t = JSON.parse(raw);
      if(t.expires_at && Date.now()/1000 > t.expires_at - 120){
        LS.removeItem("ytm_token"); // expired — minta login ulang
      }
    }
  }catch(e){ LS.removeItem("ytm_token"); }

  // Jika belum ada credentials sama sekali → arahkan ke Settings
  if(!hasCreds() && !isLoggedIn()){
    State.view = "settings";
  }
  render();
})();
</script>
