<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="theme-color" content="#0a0a0a" />
<title>NRN Music</title>
<style>
  :root{
    --bg:#0a0a0a;
    --card:#141414;
    --card2:#1a1a1a;
    --text:#ffffff;
    --muted:#a7a7a7;
    --accent:#1ed760;
    --accent-dark:#1db954;
    --danger:#e22134;
    --border:#262626;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
    overscroll-behavior:none;-webkit-font-smoothing:antialiased;
    height:100%;overflow:hidden;touch-action:manipulation}
  #app{
    display:flex;flex-direction:column;
    height:100dvh;height:calc(100dvh - env(safe-area-inset-top));
    padding-top:env(safe-area-inset-top);
    padding-bottom:calc(88px + env(safe-area-inset-bottom));
    position:relative;
  }
  header{
    padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;
    min-height:56px;flex-shrink:0
  }
  header h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
  .icon-btn{
    width:44px;height:44px;border-radius:999px;border:none;background:transparent;
    color:var(--text);display:inline-flex;align-items:center;justify-content:center;
    cursor:pointer;flex-shrink:0
  }
  .icon-btn:active{background:var(--card2)}
  main{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 16px 8px}
  main::-webkit-scrollbar{display:none}

  /* ============ SEARCH ============ */
  .search-wrap{position:sticky;top:0;background:var(--bg);z-index:5;padding:4px 0 10px}
  .search-input{
    width:100%;height:48px;border-radius:8px;border:none;
    background:var(--card);color:var(--text);padding:0 14px 0 44px;
    font-size:16px;outline:none
  }
  .search-input::placeholder{color:var(--muted)}
  .search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}

  /* ============ CARDS GRID (Home / Library) ============ */
  .section-title{font-size:18px;font-weight:800;margin:18px 2px 10px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .card{
    background:var(--card);border-radius:10px;padding:10px;cursor:pointer;
    transition:background .15s ease;user-select:none
  }
  .card:active{background:var(--card2)}
  .card img{width:100%;aspect-ratio:1/1;border-radius:6px;object-fit:cover;background:#222;display:block}
  .card .t{font-size:14px;font-weight:700;margin:8px 2px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .s{font-size:12px;color:var(--muted);margin:0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;white-space:normal}

  /* ============ TRACK LIST ============ */
  .track{
    display:flex;align-items:center;gap:12px;padding:8px 6px;border-radius:8px;
    min-height:56px;cursor:pointer;user-select:none
  }
  .track:active{background:var(--card)}
  .track img{width:48px;height:48px;border-radius:4px;object-fit:cover;background:#222;flex-shrink:0}
  .track .meta{flex:1;min-width:0}
  .track .meta .tt{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .track .meta .st{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .track .dur{font-size:12px;color:var(--muted);flex-shrink:0}
  .play-big{
    width:72px;height:72px;border-radius:999px;background:var(--accent);
    border:none;color:#000;display:inline-flex;align-items:center;justify-content:center;
    box-shadow:0 8px 24px rgba(0,0,0,.4);cursor:pointer;flex-shrink:0
  }
  .play-big:active{transform:scale(.97);background:var(--accent-dark)}
  .hero{
    display:flex;flex-direction:column;align-items:center;gap:14px;
    padding:10px 0 18px;text-align:center
  }
  .hero img{width:180px;height:180px;border-radius:8px;object-fit:cover;box-shadow:0 10px 40px rgba(0,0,0,.6)}
  .hero h2{margin:4px 0 0;font-size:22px}
  .hero .sub{color:var(--muted);font-size:13px;margin:0 10px}

  /* ============ PLAYER BAR ============ */
  #player{
    position:fixed;left:0;right:0;
    bottom:calc(64px + env(safe-area-inset-bottom));
    margin:0 10px;border-radius:12px;
    background:linear-gradient(180deg,#2a2a2a,#181818);
    box-shadow:0 -4px 20px rgba(0,0,0,.5);
    z-index:50;overflow:hidden;
    display:none;
  }
  #player.show{display:block}
  .prow{display:flex;align-items:center;gap:10px;padding:8px 10px}
  .prow img{width:44px;height:44px;border-radius:6px;object-fit:cover;flex-shrink:0;background:#333}
  .pinfo{flex:1;min-width:0}
  .pinfo .pt{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pinfo .pa{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pbtn{
    width:44px;height:44px;border-radius:999px;border:none;background:transparent;
    color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0
  }
  .pbtn.play{background:#fff;color:#000}
  .pbtn:active{opacity:.7}
  .seekbar{height:3px;background:#444;width:100%;position:relative;cursor:pointer}
  .seekbar .fill{height:100%;background:var(--accent);width:0%}

  /* ============ BOTTOM NAV ============ */
  nav{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:rgba(10,10,10,.92);backdrop-filter:blur(14px);
    border-top:1px solid var(--border);
    display:grid;grid-template-columns:repeat(4,1fr);
    padding-bottom:env(safe-area-inset-bottom);
  }
  nav button{
    background:transparent;border:none;color:var(--muted);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3px;height:64px;font-size:11px;cursor:pointer;font-weight:600
  }
  nav button.active{color:var(--text)}
  nav button svg{width:24px;height:24px}

  /* ============ SETTINGS / LOGIN ============ */
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600;letter-spacing:.02em}
  .field input,.field textarea{
    width:100%;min-height:48px;border-radius:8px;border:1px solid var(--border);
    background:var(--card);color:var(--text);padding:12px 14px;font-size:15px;outline:none;
    font-family:inherit
  }
  .field input:focus,.field textarea:focus{border-color:var(--accent)}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    min-height:48px;padding:0 18px;border-radius:999px;border:none;cursor:pointer;
    font-weight:700;font-size:14px;letter-spacing:.01em;width:100%;margin-bottom:10px
  }
  .btn.primary{background:var(--accent);color:#000}
  .btn.primary:active{background:var(--accent-dark)}
  .btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--border)}
  .btn.danger{background:transparent;color:var(--danger);border:1px solid #4a151b}
  .code-box{
    background:#000;border:1px solid var(--border);border-radius:12px;
    padding:18px;text-align:center;margin:10px 0 16px
  }
  .code-box .lbl{font-size:11px;color:var(--muted);letter-spacing:.2em;text-transform:uppercase;margin-bottom:6px}
  .code-box .cd{font-size:30px;font-weight:900;letter-spacing:.25em;font-family:"SF Mono",Menlo,monospace}
  .link{color:var(--accent);text-decoration:none;font-weight:700;word-break:break-all}
  .muted{color:var(--muted);font-size:13px;line-height:1.5}
  .status-pill{
    display:inline-block;padding:4px 10px;border-radius:999px;
    font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase
  }
  .pill-ok{background:#0e3b1e;color:#58e088}
  .pill-no{background:#3d0f14;color:#ff7b86}
  .pill-warn{background:#3b2e0e;color:#ffd36e}
  .hr{height:1px;background:var(--border);margin:18px 0}
  .toast{
    position:fixed;left:50%;top:20px;transform:translateX(-50%);
    background:var(--card2);color:#fff;padding:10px 16px;border-radius:10px;
    font-size:13px;font-weight:600;z-index:200;max-width:90%;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
    opacity:0;transition:opacity .2s ease, transform .2s ease;pointer-events:none
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(4px)}
  .toast.err{background:#5c1016}
  .empty{
    padding:40px 20px;text-align:center;color:var(--muted)
  }
  .empty h3{color:#fff;margin:8px 0}
  .spinner{
    width:20px;height:20px;border-radius:50%;
    border:2px solid #333;border-top-color:var(--accent);
    display:inline-block;animation:spin .7s linear infinite;vertical-align:middle
  }
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="title">NRN Music</h1>
    <button class="icon-btn" onclick="go('settings')" aria-label="Settings">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>
  <main id="main"></main>
</div>

<!-- PLAYER -->
<div id="player">
  <div class="seekbar" id="seekbar" onclick="seekTo(event)"><div class="fill" id="seekfill"></div></div>
  <div class="prow">
    <img id="pthumb" src="" alt="" />
    <div class="pinfo">
      <div class="pt" id="ptitle">-</div>
      <div class="pa" id="partist">-</div>
    </div>
    <button class="pbtn" onclick="prevTrack()" aria-label="Previous">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
    </button>
    <button class="pbtn play" id="ppbtn" onclick="togglePlay()" aria-label="Play">
      <svg id="ppicon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button class="pbtn" onclick="nextTrack()" aria-label="Next">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6h2v12h-2z"/></svg>
    </button>
  </div>
</div>

<!-- BOTTOM NAV -->
<nav>
  <button data-tab="home" onclick="go('home')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    Home
  </button>
  <button data-tab="search" onclick="go('search')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    Search
  </button>
  <button data-tab="library" onclick="go('library')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
    Library
  </button>
  <button data-tab="queue" onclick="go('queue')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="15" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
    Queue
  </button>
</nav>

<div id="toast" class="toast"></div>
<audio id="audio" preload="metadata"></audio>

<script>
/* ============================================================
   NRN MUSIC — v2.1 frontend
   DITULIS ULANG DENGAN PENGECEKAN TIAP BARIS
   ============================================================ */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const API = ""; // same origin
const audio = $("#audio");
const LS = localStorage;

/* ------- STATE ------- */
const state = {
  tab: "home",
  queue: [],       // daftar putar: [{videoId,title,artist,thumbnail,duration}]
  qIndex: -1,
  current: null,   // lagu sedang: {videoId,title,artist,thumbnail,url}
  playPromise: null, // LOCK: agar play() tidak diinterupsi pause()
  shuffle: false,
  repeat: 0,       // 0 none, 1 all, 2 one
  device: null,    // {device_code, user_code, verification_url, expires_in, interval}
  pollTimer: null,
};

/* ------- AUTH HELPERS ------- */
function getCreds(){
  try{ return JSON.parse(LS.getItem("nrn_creds")||"null"); }catch{ return null; }
}
function saveCreds(c){ LS.setItem("nrn_creds", JSON.stringify(c)); }
function getToken(){ return LS.getItem("nrn_token")||""; }
function saveToken(t){
  if(!t){ LS.removeItem("nrn_token"); return; }
  LS.setItem("nrn_token", typeof t==="string"? t : JSON.stringify(t));
}
function isLoggedIn(){ return !!getToken(); }
function authHeaders(){
  const t = getToken();
  const h = {"Content-Type":"application/json"};
  if(t) h["X-YTM-Token"] = t;
  return h;
}

/* ------- HTTP ------- */
async function req(path, opt={}){
  const res = await fetch(API + path, {
    ...opt,
    headers: {...authHeaders(), ...(opt.headers||{})},
  });
  const text = await res.text();
  let data = null;
  try{ data = text ? JSON.parse(text) : null; }catch{ data = {raw:text}; }
  if(!res.ok){
    const msg = (data && (data.detail || data.error || data.error_description)) || text || ("HTTP "+res.status);
    throw new Error(msg);
  }
  return data;
}

/* ------- TOAST ------- */
let _tt=null;
function toast(msg, isErr=false){
  const t = $("#toast");
  t.textContent = msg;
  t.classList.toggle("err", !!isErr);
  t.classList.add("show");
  clearTimeout(_tt);
  _tt = setTimeout(()=>t.classList.remove("show"), 2600);
}

/* ------- ROUTING ------- */
function go(tab, extra){
  state.tab = tab;
  $$("nav button").forEach(b=>b.classList.toggle("active", b.dataset.tab===tab));
  const titles = {home:"NRN Music", search:"Search", library:"Library", queue:"Queue", settings:"Settings", playlist:"Playlist", album:"Album"};
  $("#title").textContent = titles[tab] || "NRN Music";
  const m = $("#main");
  m.scrollTop = 0;
  if(tab==="home") renderHome();
  else if(tab==="search") renderSearch(extra);
  else if(tab==="library") renderLibrary();
  else if(tab==="queue") renderQueue();
  else if(tab==="settings") renderSettings();
  else if(tab==="playlist") renderPlaylist(extra);
  else if(tab==="album") renderAlbum(extra);
}

/* ------- RENDER: HOME ------- */
async function renderHome(){
  const m = $("#main");
  m.innerHTML = `<div class="empty"><span class="spinner"></span><br><br>Memuat beranda...</div>`;
  try{
    const d = await req("/api/home");
    let html = "";
    (d.shelves||[]).forEach(s=>{
      if(!s.items || !s.items.length) return;
      html += `<div class="section-title">${escapeHtml(s.title||"")}</div>`;
      html += `<div class="grid">` + s.items.slice(0,6).map(c=>cardHtml(c)).join("") + `</div>`;
    });
    if(!html) html = `<div class="empty"><h3>Belum ada konten</h3><p class="muted">Coba cari lagu lewat menu Search.</p></div>`;
    m.innerHTML = html;
  }catch(e){
    m.innerHTML = `<div class="empty"><h3>Gagal muat beranda</h3><p class="muted">${escapeHtml(e.message)}</p></div>`;
  }
}

function cardHtml(c){
  const id = c.id||"";
  const kind = c.kind||"mixed";
  const onclick = kind==="album"
    ? `go('album',${JSON.stringify(id)})`
    : `go('playlist',${JSON.stringify(id)})`;
  return `<div class="card" onclick='${onclick}'>
    <img loading="lazy" src="${c.thumbnail||""}" alt="" onerror="this.style.visibility='hidden'"/>
    <div class="t">${escapeHtml(c.title||"")}</div>
    <div class="s">${escapeHtml(c.subtitle||(c.count? c.count+" lagu" : ""))}</div>
  </div>`;
}

/* ------- RENDER: SEARCH ------- */
let _sqTimer=null;
function renderSearch(initial){
  const m = $("#main");
  m.innerHTML = `
    <div class="search-wrap">
      <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="sq" class="search-input" placeholder="Cari lagu, artis, album..." autocomplete="off" />
    </div>
    <div id="sres"><div class="empty"><p class="muted">Ketik untuk mencari lagu di YouTube Music.</p></div></div>`;
  const inp = $("#sq");
  inp.addEventListener("input", ()=>{
    clearTimeout(_sqTimer);
    const q = inp.value.trim();
    _sqTimer = setTimeout(()=>doSearch(q), 350);
  });
  if(initial){ inp.value = initial; doSearch(initial); }
  else setTimeout(()=>inp.focus(),50);
}
async function doSearch(q){
  const r = $("#sres");
  if(!q){ r.innerHTML = `<div class="empty"><p class="muted">Ketik untuk mencari lagu di YouTube Music.</p></div>`; return; }
  r.innerHTML = `<div class="empty"><span class="spinner"></span></div>`;
  try{
    const d = await req("/api/search?q="+encodeURIComponent(q));
    if(!d.tracks || !d.tracks.length){
      r.innerHTML = `<div class="empty"><h3>Tidak ditemukan</h3><p class="muted">Coba kata kunci lain.</p></div>`;
      return;
    }
    r.innerHTML = d.tracks.map((t,i)=>trackHtml(t,i)).join("");
  }catch(e){
    r.innerHTML = `<div class="empty"><h3>Gagal cari</h3><p class="muted">${escapeHtml(e.message)}</p></div>`;
  }
}

/* ------- RENDER: PLAYLIST / ALBUM ------- */
async function renderPlaylist(id){
  const m = $("#main");
  m.innerHTML = `<div class="empty"><span class="spinner"></span></div>`;
  try{
    const d = await req("/api/playlist/"+encodeURIComponent(id));
    state.queue = d.tracks||[];
    state.qIndex = -1;
    m.innerHTML = `
      <div class="hero">
        <img src="${d.thumbnail||""}" onerror="this.style.visibility='hidden'"/>
        <h2>${escapeHtml(d.title||"")}</h2>
        <p class="sub">${escapeHtml(d.description||"")} · ${d.count||0} lagu</p>
        <button class="play-big" onclick="playFromQueue(0)" aria-label="Putar Semua">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="#000" style="margin-left:4px"><path d="M8 5v14l11-7z"/></svg>
        </button>
      </div>
      <div>${(d.tracks||[]).map((t,i)=>trackHtml(t,i)).join("")}</div>`;
  }catch(e){
    m.innerHTML = `<div class="empty"><h3>Gagal muat playlist</h3><p class="muted">${escapeHtml(e.message)}</p></div>`;
  }
}
async function renderAlbum(id){
  const m = $("#main");
  m.innerHTML = `<div class="empty"><span class="spinner"></span></div>`;
  try{
    const d = await req("/api/album/"+encodeURIComponent(id));
    state.queue = d.tracks||[];
    state.qIndex = -1;
    m.innerHTML = `
      <div class="hero">
        <img src="${d.thumbnail||""}" onerror="this.style.visibility='hidden'"/>
        <h2>${escapeHtml(d.title||"")}</h2>
        <p class="sub">${escapeHtml(d.artist||"")} · ${d.count||0} lagu</p>
        <button class="play-big" onclick="playFromQueue(0)" aria-label="Putar Semua">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="#000" style="margin-left:4px"><path d="M8 5v14l11-7z"/></svg>
        </button>
      </div>
      <div>${(d.tracks||[]).map((t,i)=>trackHtml(t,i)).join("")}</div>`;
  }catch(e){
    m.innerHTML = `<div class="empty"><h3>Gagal muat album</h3><p class="muted">${escapeHtml(e.message)}</p></div>`;
  }
}

/* ------- RENDER: LIBRARY ------- */
async function renderLibrary(){
  const m = $("#main");
  if(!isLoggedIn()){
    m.innerHTML = `<div class="empty">
      <h3>Belum Login</h3>
      <p class="muted" style="margin-bottom:18px">Untuk melihat Liked Songs, Playlist, dan Album tersimpan, silakan login terlebih dahulu di Settings.</p>
      <button class="btn primary" onclick="go('settings')">Buka Pengaturan & Login</button>
    </div>`;
    return;
  }
  m.innerHTML = `<div class="empty"><span class="spinner"></span><br><br>Memuat library...</div>`;
  try{
    const d = await req("/api/library");
    let html = "";
    if(d.liked && d.liked.tracks && d.liked.tracks.length){
      html += `<div class="section-title">Liked Songs</div>`;
      html += d.liked.tracks.slice(0,30).map((t,i)=>trackHtml(t,i)).join("");
    }
    if(d.playlists && d.playlists.length){
      html += `<div class="section-title">Playlist Kamu</div><div class="grid">`;
      html += d.playlists.slice(0,10).map(c=>cardHtml({...c, kind:"playlist"})).join("");
      html += `</div>`;
    }
    if(d.albums && d.albums.length){
      html += `<div class="section-title">Album Tersimpan</div><div class="grid">`;
      html += d.albums.slice(0,10).map(c=>cardHtml({...c, kind:"album"})).join("");
      html += `</div>`;
    }
    if(!html) html = `<div class="empty"><h3>Library kosong</h3><p class="muted">Simpan beberapa lagu di YouTube Music terlebih dahulu.</p></div>`;
    m.innerHTML = html;
  }catch(e){
    const msg = e.message || "";
    if(msg.includes("LOGIN_REQUIRED") || msg.includes("401") || msg.includes("Unauthorized")){
      saveToken("");
      renderLibrary();
      return;
    }
    m.innerHTML = `<div class="empty"><h3>Gagal muat library</h3><p class="muted">${escapeHtml(msg)}</p>
      <button class="btn ghost" style="margin-top:14px" onclick="go('settings')">Cek Pengaturan Login</button></div>`;
  }
}

/* ------- RENDER: QUEUE ------- */
function renderQueue(){
  const m = $("#main");
  if(!state.queue.length){
    m.innerHTML = `<div class="empty"><h3>Queue kosong</h3><p class="muted">Buka playlist atau cari lagu, lalu tekan Putar Semua.</p></div>`;
    return;
  }
  m.innerHTML = `<div class="section-title">Queue (${state.queue.length})</div>`
    + state.queue.map((t,i)=>trackHtml(t,i, state.qIndex===i)).join("");
}

/* ------- RENDER: SETTINGS + LOGIN ------- */
function renderSettings(){
  const m = $("#main");
  const creds = getCreds();
  const logged = isLoggedIn();
  m.innerHTML = `
    <div class="section-title">Akun YouTube Music</div>
    <p class="muted" style="margin:-4px 2px 14px">Buat <b>OAuth Client ID</b> tipe <b>TVs and Limited Input devices</b> di Google Cloud Console, lalu masukkan di bawah. Status consent harus <b>In Production</b> (klik Publish App).</p>

    <div class="field">
      <label>Client ID</label>
      <input id="cid" placeholder="xxxx.apps.googleusercontent.com" value="${escapeAttr(creds?.client_id||"")}" />
    </div>
    <div class="field">
      <label>Client Secret</label>
      <input id="csec" placeholder="GOCSPX-..." value="${escapeAttr(creds?.client_secret||"")}" />
    </div>

    <button class="btn primary" onclick="saveCredsOnly()">💾 Simpan Client ID & Secret</button>

    <div class="hr"></div>

    <div class="section-title" style="margin-top:0">Login</div>
    <div style="margin:-4px 2px 12px">
      ${logged
        ? `<span class="status-pill pill-ok">✓ Sudah Login</span>`
        : `<span class="status-pill pill-no">✗ Belum Login</span>`}
    </div>

    <div id="loginBox">
      ${logged
        ? `<button class="btn danger" onclick="logout()">🚪 Logout</button>`
        : `<button class="btn primary" onclick="startLogin()">🔑 Mulai Login (Dapatkan Kode)</button>`}
    </div>

    <div id="deviceBox" style="display:none;margin-top:10px">
      <div class="code-box">
        <div class="lbl">Kode kamu</div>
        <div class="cd" id="userCode">-</div>
      </div>
      <p class="muted">1. Buka link ini di browser (HP / laptop mana saja):<br>
      <a id="vlink" class="link" target="_blank" rel="noopener"></a></p>
      <p class="muted">2. Login pakai akun Google YouTube Music kamu → masukkan kode di atas → klik <b>Allow</b>.</p>
      <p class="muted">3. Klik tombol di bawah ini berulang sampai berhasil (atau tunggu auto-polling).</p>
      <button class="btn ghost" onclick="pollToken()">🔄 Cek Status Login</button>
      <p class="muted" id="loginStatus" style="margin-top:4px"></p>
    </div>

    <div class="hr"></div>
    <div class="section-title" style="margin-top:0">Tentang</div>
    <p class="muted">NRN Music v2.1 — Data dari YouTube Music unofficial API. Kredensial & token kamu disimpan HANYA di browser HP ini (localStorage), tidak pernah dikirim ke server manapun selain Google langsung.</p>
  `;
}

function saveCredsOnly(){
  const cid = $("#cid").value.trim();
  const csec = $("#csec").value.trim();
  if(!cid || !csec){ toast("Client ID & Secret wajib diisi", true); return; }
  saveCreds({client_id:cid, client_secret:csec});
  toast("✓ Tersimpan");
}

async function startLogin(){
  const creds = getCreds();
  if(!creds?.client_id || !creds?.client_secret){
    // coba ambil dari input kalau belum disimpan
    const cid = $("#cid").value.trim();
    const csec = $("#csec").value.trim();
    if(!cid || !csec){ toast("Isi Client ID & Secret dulu", true); return; }
    saveCreds({client_id:cid, client_secret:csec});
  }
  const c = getCreds();
  try{
    const d = await req("/api/auth/device", {
      method:"POST", body: JSON.stringify(c),
    });
    state.device = d;
    $("#loginBox").style.display = "none";
    $("#deviceBox").style.display = "block";
    $("#userCode").textContent = d.user_code || "";
    const vl = $("#vlink");
    vl.textContent = d.verification_url || d.verification_uri || "";
    vl.href = d.verification_url || d.verification_uri || "#";
    $("#loginStatus").textContent = "Menunggu konfirmasi di browser...";
    // Auto polling sesuai interval yang disarankan Google
    clearInterval(state.pollTimer);
    const interval = Math.max(5, (d.interval||5)) * 1000;
    state.pollTimer = setInterval(()=>pollToken(true), interval);
  }catch(e){
    toast("Gagal minta kode: "+e.message, true);
  }
}

async function pollToken(silent){
  if(!state.device){ if(!silent)toast("Mulai login dulu",true); return; }
  const c = getCreds();
  try{
    const d = await req("/api/auth/token", {
      method:"POST",
      body: JSON.stringify({
        client_id: c.client_id,
        client_secret: c.client_secret,
        device_code: state.device.device_code,
      }),
    });
    if(d.access_token){
      // BERHASIL
      clearInterval(state.pollTimer);
      saveToken(d);
      $("#loginStatus").textContent = "✓ BERHASIL LOGIN!";
      toast("✓ Login berhasil");
      setTimeout(()=>go("library"), 700);
    } else if(d.error === "authorization_pending"){
      $("#loginStatus").textContent = "Menunggu kamu klik Allow di browser...";
      if(!silent) toast("Belum dikonfirmasi — coba lagi sebentar");
    } else if(d.error === "slow_down"){
      $("#loginStatus").textContent = "Terlalu sering cek — tunggu sebentar";
    } else if(d.error === "expired_token"){
      clearInterval(state.pollTimer);
      $("#loginStatus").textContent = "Kode expired. Klik Mulai Login lagi.";
      if(!silent) toast("Kode expired — mulai ulang", true);
    } else if(d.error){
      $("#loginStatus").textContent = d.error + (d.error_description? ": "+d.error_description : "");
      if(!silent) toast(d.error, true);
    }
  }catch(e){
    if(!silent) toast("Gagal cek: "+e.message, true);
  }
}

function logout(){
  if(!confirm("Yakin logout?")) return;
  saveToken("");
  clearInterval(state.pollTimer);
  state.device = null;
  toast("✓ Logout");
  renderSettings();
}

/* ------- TRACK HTML ------- */
function trackHtml(t, i, isPlaying){
  const mm = fmtDur(t.duration);
  const playing = isPlaying ? "style='color:var(--accent)'" : "";
  return `<div class="track" onclick="playOne(${i})" data-idx="${i}">
    <img loading="lazy" src="${t.thumbnail||""}" onerror="this.style.visibility='hidden'" alt=""/>
    <div class="meta">
      <div class="tt" ${playing}>${escapeHtml(t.title||"")}</div>
      <div class="st">${escapeHtml(t.artist||"")}${t.album? " • "+escapeHtml(t.album) : ""}</div>
    </div>
    <div class="dur">${mm}</div>
  </div>`;
}

/* ------- AUDIO ENGINE (DIPERBAIKI: RACE CONDITION) ------- */
/*
  ATURAN KETAT:
  1. Setiap kali ganti lagu: BATALKAN playPromise lama, PAUSE audio, baru set src baru.
  2. Jangan pernah panggil pause() / src = ... saat state.playPromise masih PENDING.
  3. Semua perubahan src HARUS lewat loadAndPlay().
*/

async function _cancelCurrentPlay(){
  try{
    if(state.playPromise){
      // Biarkan promise lama selesai / gagal, kita abaikan
      try{ await Promise.race([state.playPromise, new Promise(r=>setTimeout(r,80))]); }catch{}
      state.playPromise = null;
    }
    if(!audio.paused){ audio.pause(); }
  }catch{}
}

async function loadAndPlay(videoId){
  // 1. Dapatkan URL stream FRESH dari backend — jangan pakai url lawas (cepat expired)
  toast("Memuat lagu...");
  let song;
  try{
    song = await req("/api/song/"+encodeURIComponent(videoId));
  }catch(e){
    const m = e.message || "";
    if(m === "NO_STREAM"){
      toast("Tidak ada stream untuk lagu ini — coba lagu lain", true);
    } else {
      toast("Gagal muat: "+m, true);
    }
    return false;
  }
  if(!song || !song.url){
    toast("Tidak ada stream yang tersedia", true);
    return false;
  }

  // 2. KUNCI: batalkan operasi audio lama
  await _cancelCurrentPlay();

  // 3. Set src baru + load
  try{
    audio.src = song.url;
    audio.load();
  }catch(e){
    toast("Gagal set audio: "+e.message, true);
    return false;
  }

  // 4. Update UI player
  state.current = song;
  $("#ptitle").textContent = song.title || videoId;
  $("#partist").textContent = song.artist || "";
  $("#pthumb").src = song.thumbnail || "";
  $("#player").classList.add("show");
  _setPlayIcon(false); // akan berubah jadi true saat event playing

  // 5. PLAY — tangkap exception dengan benar
  try{
    state.playPromise = audio.play();
    await state.playPromise;
    state.playPromise = null;
    _setPlayIcon(true);
    return true;
  }catch(err){
    state.playPromise = null;
    // Chrome: AbortError = user / kode interupsi — abaikan saja
    if(err && err.name === "AbortError") return false;
    // interrupted-by-pause = race yang sudah kita cegah, tapi kalau masih muncul juga abaikan
    if(err && /interrupted/.test(err.message || "")) return false;
    toast("Gagal putar: "+(err.message||err), true);
    return false;
  }
}

function playOne(i){
  // Kalau queue beda (misal dari search), buat queue baru dari main
  const tracks = collectTracksFromMain();
  if(tracks && tracks.length){
    state.queue = tracks;
  }
  if(i < 0 || i >= state.queue.length) return;
  state.qIndex = i;
  const t = state.queue[i];
  if(!t || !t.videoId) return;
  loadAndPlay(t.videoId);
  // Highlight yang aktif
  if(state.tab === "queue") renderQueue();
}

function playFromQueue(i){
  if(i < 0 || i >= state.queue.length) return;
  state.qIndex = i;
  const t = state.queue[i];
  if(!t || !t.videoId) return;
  loadAndPlay(t.videoId);
}

function collectTracksFromMain(){
  // Kalau user klik track dari search / library yang bukan playlist,
  // kita build queue dari semua track yang terlihat di main.
  if(state.tab === "playlist" || state.tab === "album" || state.tab === "queue") return null;
  const out = [];
  $$(".track", $("#main")).forEach(tr=>{
    const idx = parseInt(tr.dataset.idx||"0",10);
    // data disimpan di state.queue sementara dari render; kalau tidak ada kita tidak bisa
  });
  // Fallback: state.queue mungkin masih ada dari halaman sebelumnya
  return null;
}

async function togglePlay(){
  if(!state.current){ toast("Pilih lagu dulu",true); return; }
  try{
    if(audio.paused){
      state.playPromise = audio.play();
      await state.playPromise;
      state.playPromise = null;
      _setPlayIcon(true);
    } else {
      audio.pause();
      _setPlayIcon(false);
    }
  }catch(err){
    state.playPromise = null;
    if(err && err.name === "AbortError") return;
    toast("Play error: "+(err.message||err), true);
  }
}

function _setPlayIcon(isPlaying){
  const ic = $("#ppicon");
  if(isPlaying){
    ic.innerHTML = `<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>`;
  } else {
    ic.innerHTML = `<path d="M8 5v14l11-7z"/>`;
  }
}

function prevTrack(){
  if(!state.queue.length) return;
  let n = state.qIndex - 1;
  if(n < 0) n = state.repeat === 1 ? state.queue.length - 1 : 0;
  playFromQueue(n);
}
function nextTrack(auto){
  if(!state.queue.length) return;
  if(state.repeat === 2 && auto){
    // ulang lagu yang sama
    audio.currentTime = 0;
    audio.play().catch(()=>{});
    return;
  }
  let n = state.qIndex + 1;
  if(n >= state.queue.length){
    if(state.repeat === 1) n = 0;
    else { toast("Queue habis"); return; }
  }
  playFromQueue(n);
}

function seekTo(ev){
  const bar = $("#seekbar");
  const r = bar.getBoundingClientRect();
  const pct = Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width));
  if(audio.duration) audio.currentTime = pct * audio.duration;
}

/* ------- AUDIO EVENTS ------- */
audio.addEventListener("timeupdate", ()=>{
  if(!audio.duration) return;
  $("#seekfill").style.width = ((audio.currentTime/audio.duration)*100).toFixed(2)+"%";
});
audio.addEventListener("ended", ()=> nextTrack(true) );
audio.addEventListener("playing", ()=> _setPlayIcon(true) );
audio.addEventListener("pause", ()=> _setPlayIcon(false) );
audio.addEventListener("error", (e)=>{
  const c = audio.error && audio.error.code;
  const map = {1:"Dibatalkan",2:"Gagal koneksi",3:"Decode error",4:"Sumber tidak didukung / 403"};
  toast("Audio error: "+(map[c]||"Unknown")+" — coba lagu lain", true);
  _setPlayIcon(false);
});

/* ------- UTIL ------- */
function fmtDur(s){
  s = parseInt(s||0,10);
  if(!s) return "";
  const m = Math.floor(s/60), ss = s%60;
  return m+":"+(ss<10?"0":"")+ss;
}
function escapeHtml(s){
  return String(s==null?"":s).replace(/[&<>"']/g, c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}
function escapeAttr(s){ return escapeHtml(s); }

/* ------- BOOT ------- */
window.addEventListener("DOMContentLoaded", ()=>{
  // Pertama kali: kalau belum ada creds, langsung ke Settings
  const c = getCreds();
  if(!c || !c.client_id) go("settings");
  else go("home");
});
